/* ---------- KONEKT BROWSER (preinstalled, the default browser) ----------
   The desktop build is Chromium via Electron; here the engine is the page's own,
   so sites that refuse to be framed get an honest card instead of a blank pane. */
const KB_DIALS = [
  { t:'KONEKT',    u:'https://konekt-tawny.vercel.app/',  k:'globe' },
  { t:'KONEKT OS', u:'https://konekt-os.vercel.app/',     k:'globe' },
  { t:'BROWSER',   u:'https://konekt-browser.vercel.app/',k:'browser' },
  { t:'ГОСУСЛУГИ', u:'https://www.gosuslugi.ru/',         k:'G' },
  { t:'ЯНДЕКС',    u:'https://ya.ru/',                    k:'Я' },
  { t:'ВИКИПЕДИЯ', u:'https://ru.wikipedia.org/',         k:'W' }
];
/* only our own origins are known to allow framing; everything else opens outside */
function kbFrameable(url){
  return /^https:\/\/(konekt-tawny|konekt-os|konekt-browser)[a-z0-9-]*\.vercel\.app(\/|$)/i.test(url);
}
function kbHost(url){ try{ return new URL(url).hostname.replace(/^www\./, ''); }catch(e){ return url; } }
/* "open outside": on the OS this opens a real windowed Chromium (tabs,
   downloads); in a browser tab it is just a new tab */
function kbOpenOutside(url){
  if(SYS && SYS.canOpen){
    sysPost('/api/open', { url }).then(() => toast('Открыто в настоящем браузере', 2400))
      .catch(() => open(url, '_blank', 'noopener'));
  } else open(url, '_blank', 'noopener');
}
function launchBrowser(w, arg){
  const st = { tabs: [{ url:'', back:[], fwd:[] }], cur:0 };
  w.body.innerHTML =
    '<div class="kb">' +
      '<div class="kb-tabs"></div>' +
      '<div class="kb-bar">' +
        '<button class="kb-b bk" title="Back" aria-label="Back">' + IC.back + '</button>' +
        '<button class="kb-b fw" title="Forward" aria-label="Forward">' + IC.fwd + '</button>' +
        '<button class="kb-b rl" title="Reload" aria-label="Reload">' + IC.reload + '</button>' +
        '<button class="kb-b hm" title="Speed Dial" aria-label="Speed Dial">' + IC.home + '</button>' +
        '<div class="kb-omni"><span class="lock">HTTPS</span>' +
          '<input placeholder="Поиск или адрес" spellcheck="false" autocomplete="off" aria-label="Address bar"></div>' +
        '<button class="kb-b st" title="Bookmark" aria-label="Bookmark">' + IC.star + '</button>' +
        '<button class="kb-b ex" title="Open outside KONEKT OS" aria-label="Open outside">' + IC.ext + '</button>' +
      '</div>' +
      '<div class="kb-view"></div>' +
      '<div class="kb-note"><span class="l"></span><span class="r"></span></div>' +
    '</div>';
  const tabsBox = $('.kb-tabs', w.body), view = $('.kb-view', w.body);
  const omni = $('.kb-omni input', w.body), lock = $('.kb-omni .lock', w.body);
  const noteL = $('.kb-note .l', w.body), noteR = $('.kb-note .r', w.body);
  const tab = () => st.tabs[st.cur];

  function go(url, push){
    const t = tab();
    if(push !== false && url !== t.url){
      t.back.push(t.url);          /* '' is Speed Dial — Back must return to it */
      t.fwd.length = 0;
    }
    t.url = url;
    render();
  }
  function submit(v){
    v = v.trim();
    if(!v){ go(''); return; }
    if(/^[a-z]+:\/\//i.test(v)) return go(v);
    if(/^[\w-]+(\.[\w-]+)+(\/|$)/.test(v)) return go('https://' + v);
    go('https://yandex.ru/search/?text=' + encodeURIComponent(v));
  }
  function renderTabs(){
    tabsBox.innerHTML = '';
    st.tabs.forEach((t, i) => {
      const label = t.url ? kbHost(t.url) : 'Speed Dial';
      const b = el('<button class="kb-tab' + (i === st.cur ? ' on' : '') + '" aria-label="' + esc(label) + '">' +
        '<span class="t">' + esc(label) + '</span>' +
        (st.tabs.length > 1 ? '<span class="x" role="button" aria-label="Close tab">×</span>' : '') + '</button>');
      b.onclick = e => {
        if(e.target.classList.contains('x')){
          st.tabs.splice(i, 1);
          st.cur = Math.min(st.cur, st.tabs.length - 1);
        } else st.cur = i;
        render();
      };
      tabsBox.appendChild(b);
    });
    const nb = el('<button class="kb-newtab" title="New tab" aria-label="New tab">' + IC.plus + '</button>');
    nb.onclick = () => { st.tabs.push({ url:'', back:[], fwd:[] }); st.cur = st.tabs.length - 1; render(); };
    tabsBox.appendChild(nb);
  }
  function speedDial(){
    const sd = el('<div class="kb-sd scroll">' +
      '<div class="mk">' + logoLong(26) + '</div><div class="cl" id="kbClock"></div>' +
      '<h3>Speed Dial</h3><div class="kb-dials"></div></div>');
    const grid = $('.kb-dials', sd);
    KB_DIALS.forEach(d => {
      const fav = d.k === 'globe' ? globe(20, 7)
                : d.k === 'browser' ? IC.browser
                : '<span style="font-size:17px;font-weight:800">' + d.k + '</span>';
      const b = el('<button class="kb-dial" aria-label="' + esc(d.t) + '">' +
        '<span class="fav">' + fav + '</span><span class="t">' + esc(d.t) + '</span>' +
        '<span class="h">' + esc(kbHost(d.u)) + '</span></button>');
      b.onclick = () => go(d.u);
      grid.appendChild(b);
    });
    return sd;
  }
  function render(){
    renderTabs();
    const t = tab();
    view.innerHTML = '';
    omni.value = t.url;
    lock.textContent = t.url ? (t.url.startsWith('https://') ? 'HTTPS' : 'НЕ ЗАЩИЩЕНО') : '';
    lock.classList.toggle('no', !!t.url && !t.url.startsWith('https://'));
    $('.bk', w.body).disabled = !t.back.length;
    $('.fw', w.body).disabled = !t.fwd.length;

    if(!t.url){
      view.appendChild(speedDial());
      noteL.textContent = 'KONEKT BROWSER · предустановлен';
      noteR.innerHTML = '';
      setWinTitle(w, 'KONEKT BROWSER');
      return;
    }
    setWinTitle(w, 'KONEKT BROWSER — ' + kbHost(t.url));
    if(kbFrameable(t.url)){
      const f = el('<iframe title="' + esc(kbHost(t.url)) + '" allow="camera; microphone; fullscreen; clipboard-write"></iframe>');
      view.appendChild(f);
      f.src = t.url;
      noteL.textContent = kbHost(t.url);
      noteR.innerHTML = '<a href="' + esc(t.url) + '" target="_blank" rel="noopener">открыть снаружи ↗</a>';
      $('a', noteR).onclick = e => { if(SYS && SYS.canOpen){ e.preventDefault(); kbOpenOutside(t.url); } };
    } else {
      view.appendChild(el('<div class="kb-page">' +
        '<div>' + globe(34, 6) + '</div>' +
        '<div class="t">' + esc(kbHost(t.url)) + ' не разрешает встраивание</div>' +
        '<div class="d">Сайт присылает заголовок, который запрещает открывать его внутри другой страницы. ' +
        'В настоящем KONEKT BROWSER — движок Chromium, и такой страницы нет: она просто открывается. ' +
        'Здесь, внутри демо в браузере, честнее показать это, чем пустое окно.</div>' +
        '<button class="btn-solid kb-openreal">Открыть в настоящем браузере</button>' +
        '</div>'));
      $('.kb-openreal', view).onclick = () => kbOpenOutside(t.url);
      noteL.textContent = 'встраивание запрещено сайтом';
      noteR.innerHTML = '';
    }
  }
  omni.onkeydown = e => { if(e.key === 'Enter') submit(omni.value); };
  $('.bk', w.body).onclick = () => { const t = tab(); if(t.back.length){ t.fwd.push(t.url); t.url = t.back.pop(); render(); } };
  $('.fw', w.body).onclick = () => { const t = tab(); if(t.fwd.length){ t.back.push(t.url); t.url = t.fwd.pop(); render(); } };
  $('.rl', w.body).onclick = () => render();
  $('.hm', w.body).onclick = () => go('');
  $('.st', w.body).onclick = () => { noteL.textContent = tab().url ? 'закладка сохранена локально' : 'нечего добавлять в закладки'; };
  $('.ex', w.body).onclick = () => { if(tab().url) kbOpenOutside(tab().url); };

  const clock = setInterval(() => {
    const c = $('#kbClock', w.body);
    if(c){ const n = new Date(); c.textContent = two(n.getHours()) + ':' + two(n.getMinutes()); }
  }, 1000);
  /* the browser is a living product: notice when a new build of
     konekt-browser.vercel.app shipped since it was last opened here */
  if(SYS){
    fetch('/api/kb/fresh', { cache:'no-store' }).then(r => r.json()).then(d => {
      if(!d.ok || !d.etag) return;
      const seen = store.get('kos.kbEtag', null);
      store.set('kos.kbEtag', d.etag);
      if(seen && seen !== d.etag)
        notify({ title:'KONEKT BROWSER обновился', body:'Открывается самая свежая сборка.', icon: IC.browser });
      noteL.textContent = 'KONEKT BROWSER · предустановлен · самая свежая сборка';
    }).catch(() => {});
  }
  w.onClose = () => clearInterval(clock);
  w.onArg = a => { if(a && a.url) go(a.url); };
  render();
  const c = $('#kbClock', w.body);
  if(c){ const n = new Date(); c.textContent = two(n.getHours()) + ':' + two(n.getMinutes()); }
  if(arg && arg.url) go(arg.url);
}

/* ---------- the KONEKT products, as real applications ----------
   On the OS these are applications: their own window, their own session,
   their own place in the window list. In a browser tab there is no system to
   start them, so the page falls back to embedding and says which it is. */
function launchProduct(w, id, url, title){
  if(SYS){
    /* a real application - the window belongs to the system, not to this page */
    w.body.innerHTML =
      '<div class="kn-ov" style="position:static;flex:1">' +
        '<div class="pulse">' + globe(40, 5) + '</div>' +
        '<div class="s">' + esc(title) + ' — ' + TT('starting') + '</div>' +
      '</div>';
    sysPost('/api/app/launch', { id })
      .then(() => {
        setTimeout(() => { const win = winFor(id); if(win) closeWin(win); }, 900);
        notify({ title: title, body: TT('appStarted'), icon: IC.grid4 });
      })
      .catch(err => {
        w.body.innerHTML =
          '<div class="kb-page"><div>' + globe(34, 6) + '</div>' +
          '<div class="t">' + esc(title) + '</div>' +
          '<div class="d">' + esc(String(err.message || err)) + '</div>' +
          '<a class="btn-solid" href="' + esc(url) + '" target="_blank" rel="noopener">' + TT('openInBrowser') + '</a></div>';
      });

  }
  launchSite(w, url, title);
}

/* ---------- a sibling product, embedded (browser tab only) ---------- */
function launchSite(w, url, title){
  w.body.innerHTML =
    '<div class="kn">' +
      '<div class="kn-ov"><div class="pulse">' + globe(40, 5) + '</div>' +
        '<div class="s">' + esc(title) + '</div>' +
        '<a href="' + esc(url) + '" target="_blank" rel="noopener">open in the browser instead</a>' +
      '</div>' +
      '<iframe title="' + esc(title) + '" allow="camera; microphone; fullscreen; clipboard-write"></iframe>' +
    '</div>';
  const f = $('iframe', w.body), ov = $('.kn-ov', w.body);

  f.addEventListener('load', () => { clearTimeout(t); setTimeout(() => ov.classList.add('off'), 350); });

}

function launchMedia(w){

/* ---------- FILES ---------- */
let filesRefresh = null;
function refreshFiles(){ if(filesRefresh) filesRefresh(); }
function launchFiles(w, arg){
  const st = { cwd: (arg && arg.path) ? arg.path.slice() : HOME.slice(), sel: null, hist: [], hidden: false };
  w.body.innerHTML =
    '<div class="fx">' +
      '<div class="fx-bar">' +
        '<button class="fx-b bk" title="Back">' + IC.back + '</button>' +
        '<button class="fx-b up" title="Up">' + IC.up + '</button>' +
        '<div class="fx-path scroll"></div>' +
        '<button class="fx-b nf" title="New folder">' + IC.files + '</button>' +
        '<button class="fx-b nd" title="New text file">' + IC.plus + '</button>' +
        '<button class="fx-b rn" title="Rename">' + IC.pencil + '</button>' +
        '<button class="fx-b dl" title="Delete">' + IC.trash + '</button>' +
      '</div>' +
      '<div class="fx-grid scroll"></div>' +
      '<div class="fx-status"><span class="l"></span><span class="r"></span></div>' +
    '</div>';
  const grid = $('.fx-grid', w.body), path = $('.fx-path', w.body);
  const stL = $('.fx-status .l', w.body), stR = $('.fx-status .r', w.body);
  const bBk = $('.bk', w.body), bUp = $('.up', w.body), bRn = $('.rn', w.body), bDl = $('.dl', w.body);

  function go(parts, push){
    const node = fsGet(parts);
    if(!node || node.type !== 'dir') return;
    if(push !== false) st.hist.push(st.cwd.slice());
    st.cwd = parts.slice();
    st.sel = null;
    render();
  }
  function note(t){ stR.textContent = t; setTimeout(() => { if(stR.textContent === t) stR.textContent = ''; }, 2600); }
  function startRename(name){
    const it = $$('.fi', grid).find(x => x.dataset.name === name);
    if(!it) return;
    const t = $('.t', it);
    t.outerHTML = '<input class="ren" value="' + esc(name) + '" spellcheck="false">';
    const inp = $('.ren', it);
    inp.focus();
    const dot = name.lastIndexOf('.');
    inp.setSelectionRange(0, dot > 0 ? dot : name.length);
    const commit = ok => {
      const nn = inp.value.trim();
      if(ok && nn && nn !== name){
        const err = fsRename(st.cwd.concat(name), nn);
        if(err){ note(err); }
      }
      render(); renderIcons();
    };
    inp.onkeydown = e => {
      if(e.key === 'Enter') commit(true);
      if(e.key === 'Escape') commit(false);
      e.stopPropagation();
    };
    inp.onblur = () => commit(true);
    inp.onclick = e => e.stopPropagation();
    inp.ondblclick = e => e.stopPropagation();
  }
  function openEntry(name, node){
    if(node.type === 'dir'){ go(st.cwd.concat(name)); return; }
    openApp('notes', { path: st.cwd.concat(name) });
  }
  function render(){
    const dir = fsGet(st.cwd);
    if(!dir){ go(HOME, false); return; }
    /* breadcrumb */
    path.innerHTML = '<button class="fx-crumb" data-i="0">HEADSET</button>';
    st.cwd.forEach((seg, i) => {
      path.insertAdjacentHTML('beforeend',
        '<span class="fx-sl">/</span><button class="fx-crumb' + (i === st.cwd.length - 1 ? ' cur' : '') + '" data-i="' + (i + 1) + '">' + esc(seg) + '</button>');
    });
    $$('.fx-crumb', path).forEach(c => c.onclick = () => go(st.cwd.slice(0, +c.dataset.i)));
    /* entries: dirs first, then files */
    grid.innerHTML = '';
    const names = Object.keys(dir.children).filter(n => st.hidden || inTrash() || n[0] !== '.').sort((a, b) => {
      const A = dir.children[a], B = dir.children[b];
      if(A.type !== B.type) return A.type === 'dir' ? -1 : 1;
      return a.localeCompare(b);
    });
    names.forEach(name => {
      const node = dir.children[name];
      const it = el('<button class="fi ' + node.type + '" data-name="' + esc(name) + '" aria-label="' + esc(name) + '">' +
        (node.type === 'dir' ? IC.files : IC.file) + '<span class="t">' + esc(name) + '</span></button>');
      it.onclick = e => { e.stopPropagation(); st.sel = name; $$('.fi', grid).forEach(x => x.classList.remove('sel')); it.classList.add('sel'); syncBtns(); };
      it.ondblclick = e => { e.stopPropagation(); openEntry(name, node); };
      it.oncontextmenu = e => {
        e.preventDefault(); e.stopPropagation();
        st.sel = name; $$('.fi', grid).forEach(x => x.classList.remove('sel')); it.classList.add('sel'); syncBtns();
        showCMenu(e.clientX, e.clientY, [
          { t:'Open', icon:IC.file, fn: () => openEntry(name, node) },
          { t:'Rename', icon:IC.pencil, fn: () => startRename(name) },
          '-',
          { t:'Delete', icon:IC.trash, fn: () => del(name) }
        ]);
      };
      grid.appendChild(it);
    });
    grid.onclick = () => { st.sel = null; $$('.fi', grid).forEach(x => x.classList.remove('sel')); syncBtns(); };
    stL.textContent = names.length + ' item' + (names.length === 1 ? '' : 's') + (inTrash() ? ' \u00b7 trash' : '');
    let eb = $('.fx-empty', w.body);
    if(inTrash() && names.length){
      if(!eb){
        eb = el('<button class="fx-b fx-empty" title="Empty trash">' + IC.trash + '</button>');
        eb.onclick = () => emptyTrash();
        $('.fx-bar', w.body).appendChild(eb);
      }
    } else if(eb) eb.remove();
    syncBtns();
  }
  function syncBtns(){
    bUp.disabled = !st.cwd.length;
    bBk.disabled = !st.hist.length;
    bRn.disabled = !st.sel;
    bDl.disabled = !st.sel;
  }
  const TRASH = HOME.concat('.trash');
  const inTrash = () => fsPathStr(st.cwd).startsWith(fsPathStr(TRASH));
  function del(name){
    /* Ubuntu semantics: Delete moves to the trash; inside the trash it is final */
    let err = null;
    if(inTrash()){
      err = fsRm(st.cwd.concat(name), true);
      note(err || (name + ' — deleted forever'));
    } else {
      if(!fsGet(TRASH)) fsMk(TRASH, fdir());
      const parent = fsGet(st.cwd), t = fsGet(TRASH);
      let nn = name, i = 2;
      while(t.children[nn]){ nn = name + '.' + i; i++; }
      t.children[nn] = parent.children[name];
      delete parent.children[name];
      parent.mtime = t.mtime = fsNow();
      fsSave();
      note(name + ' \u2192 trash');
    }
    st.sel = null;
    render(); renderIcons(); refreshNotesList();
  }
  function emptyTrash(){
    const t = fsGet(TRASH);
    if(t){ t.children = {}; t.mtime = fsNow(); fsSave(); }
    note('trash emptied');
    render(); renderIcons();
  }
  function fresh(base){
    let n = base, i = 2;
    const dir = fsGet(st.cwd);
    const dot = base.lastIndexOf('.');
    while(dir.children[n]){
      n = dot > 0 ? base.slice(0, dot) + '-' + i + base.slice(dot) : base + '-' + i;
      i++;
    }
    return n;
  }
  bBk.onclick = () => { const p = st.hist.pop(); if(p) go(p, false); };
  bUp.onclick = () => { if(st.cwd.length) go(st.cwd.slice(0, -1)); };
  $('.nf', w.body).onclick = () => { const n = fresh('new-folder'); fsMk(st.cwd.concat(n), fdir()); render(); renderIcons(); startRename(n); };
  $('.nd', w.body).onclick = () => { const n = fresh('new-file.txt'); fsMk(st.cwd.concat(n), ffile('')); render(); renderIcons(); refreshNotesList(); startRename(n); };
  bRn.onclick = () => { if(st.sel) startRename(st.sel); };
  bDl.onclick = () => { if(st.sel) del(st.sel); };

  /* Ubuntu file-manager keys, scoped to this window while it is on top */
  w.el.addEventListener('keydown', e => {
    if(topWin() !== w) return;
    const t = e.target || {};
    if(/^(INPUT|TEXTAREA)$/.test(t.tagName || '')) return;
    if(e.key === 'F2' && st.sel){ e.preventDefault(); startRename(st.sel); }
    else if(e.key === 'Delete' && st.sel){ e.preventDefault(); del(st.sel); }
    else if(e.key === 'Backspace'){ e.preventDefault(); if(st.cwd.length) go(st.cwd.slice(0, -1)); }
    else if((e.key || '').toLowerCase() === 'h' && e.ctrlKey){ e.preventDefault(); st.hidden = !st.hidden; render(); }
  });
  w.onArg = a => { if(a && a.path) go(a.path); };
  filesRefresh = render;
  w.onClose = () => { if(filesRefresh === render) filesRefresh = null; };
  render();
}

/* ---------- NOTES ---------- */
let notesListRefresh = null;
function refreshNotesList(){ if(notesListRefresh) notesListRefresh(); }
function launchNotes(w, arg){
  const st = { path: null, dirty: false, timer: null };
  w.body.innerHTML =
    '<div class="nx">' +
      '<div class="nx-side">' +
        '<div class="nx-head"><span>notes</span><button class="nx-new" title="New note">' + IC.plus + '</button></div>' +
        '<div class="nx-list scroll"></div>' +
      '</div>' +
      '<div class="nx-main">' +
        '<div class="nx-empty">select or create a note</div>' +
        '<textarea class="nx-ta scroll" style="display:none" spellcheck="false"></textarea>' +
        '<div class="nx-status"><span class="l"></span><span class="r"></span></div>' +
      '</div>' +
    '</div>';
  const list = $('.nx-list', w.body), ta = $('.nx-ta', w.body), empty = $('.nx-empty', w.body);
  const stL = $('.nx-status .l', w.body), stR = $('.nx-status .r', w.body);

  function findTexts(){
    /* every .txt under home, shallow walk of the usual folders */
    const out = [];
    const walk = (parts, depth) => {
      const node = fsGet(parts);
      if(!node || node.type !== 'dir' || depth > 3) return;
      Object.keys(node.children).sort().forEach(name => {
        const c = node.children[name];
        if(c.type === 'file' && /\.txt$/i.test(name)) out.push(parts.concat(name));
        else if(c.type === 'dir') walk(parts.concat(name), depth + 1);
      });
    };
    walk(HOME, 0);
    return out;
  }
  function renderList(){
    list.innerHTML = '';
    findTexts().forEach(p => {
      const on = st.path && fsPathStr(p) === fsPathStr(st.path);
      const b = el('<button class="nx-it' + (on ? ' on' : '') + '">' +
        '<span class="n">' + esc(p[p.length - 1]) + '</span>' +
        '<span class="p">' + esc(fsTilde(p.slice(0, -1))) + '</span></button>');
      b.onclick = () => load(p);
      list.appendChild(b);
    });
  }
  function load(p){
    flush();
    const node = fsGet(p);
    if(!node || node.type !== 'file'){ st.path = null; sync(); return; }
    st.path = p.slice();
    ta.value = node.content;
    sync();
    ta.focus();
  }
  function sync(){
    const has = !!st.path;
    ta.style.display = has ? '' : 'none';
    empty.style.display = has ? 'none' : '';
    stL.textContent = has ? fsTilde(st.path) : '';
    if(!has) stR.textContent = '';
    renderList();
    setWinTitle(w, has ? 'NOTES — ' + st.path[st.path.length - 1] : 'NOTES');
  }
  function flush(){
    if(st.timer){ clearTimeout(st.timer); st.timer = null; }
    if(st.dirty && st.path){
      fsWrite(st.path, ta.value);
      st.dirty = false;
      const n = new Date();
      stR.textContent = 'saved ' + two(n.getHours()) + ':' + two(n.getMinutes()) + ':' + two(n.getSeconds());
    }
  }
  ta.addEventListener('input', () => {
    st.dirty = true;
    stR.textContent = 'typing…';
    if(st.timer) clearTimeout(st.timer);
    st.timer = setTimeout(flush, 500);
  });
  $('.nx-new', w.body).onclick = () => {
    const dir = fsGet(HOME.concat('Documents')) ? HOME.concat('Documents') : HOME;
    let n = 'note.txt', i = 2;
    while(fsGet(dir.concat(n))) { n = 'note-' + i + '.txt'; i++; }
    fsMk(dir.concat(n), ffile(''));
    refreshFiles(); renderIcons();
    load(dir.concat(n));
  };
  w.onArg = a => { if(a && a.path) load(a.path); };
  notesListRefresh = renderList;
  w.onClose = () => { flush(); if(notesListRefresh === renderList) notesListRefresh = null; };
  if(arg && arg.path) load(arg.path); else sync();
}

/* ---------- TERMINAL ---------- */
const NEOFETCH_ART = [
'      _.-=======-._      ',
'    .;  _.-===-._  ;.    ',
'   / | (         ) | \\   ',
'  ;  ;  |       |  ;  ;  ',
'  |==+==+===+===+==+==|  ',
'  ;  ;  |       |  ;  ;  ',
'   \\ | (_       _) | /   ',
'    \';  \'-===-\'  ;\'      ',
'      \'-.._____..-\'      '
];
function launchTerm(w){
  w.body.innerHTML = '<div class="term scroll" tabindex="0"></div>';
  const box = $('.term', w.body);
  const st = { cwd: HOME.slice(), hist: [], hi: -1 };

  function print(html, cls){
    box.insertAdjacentHTML('beforeend', '<div class="tl' + (cls ? ' ' + cls : '') + '">' + html + '</div>');
  }
  function printText(t, cls){ print(esc(t), cls); }
  function ps(){ return user.name.toLowerCase().replace(/\s+/g, '') + '@konekt.world:' + fsTilde(st.cwd) + '$ '; }
  function inputRow(){
    const row = el('<div class="term-row"><span class="term-ps">' + esc(ps()) + '</span>' +
      '<input class="term-in" autocomplete="off" autocapitalize="off" spellcheck="false"></div>');
    box.appendChild(row);
    const inp = $('input', row);
    inp.focus();
    inp.onkeydown = e => {
      if(e.key === 'Enter'){
        const line = inp.value;
        row.remove();
        print('<span class="grn">' + esc(ps()) + '</span>' + esc(line));
        if(line.trim()){ st.hist.push(line); st.hi = st.hist.length; run(line.trim()); }
        if(document.body.contains(box)) inputRow();
      } else if(e.key === 'ArrowUp'){
        e.preventDefault();
        if(st.hi > 0){ st.hi--; inp.value = st.hist[st.hi] || ''; }
      } else if(e.key === 'ArrowDown'){
        e.preventDefault();
        if(st.hi < st.hist.length){ st.hi++; inp.value = st.hist[st.hi] || ''; }
      } else if(e.key === 'c' && e.ctrlKey){
        row.remove();
        print('<span class="grn">' + esc(ps()) + '</span>' + esc(inp.value) + '^C');
        inputRow();
      } else if(e.key === 'l' && e.ctrlKey){
        e.preventDefault();
        $$('.tl', box).forEach(x => x.remove());
      }
    };
    box.scrollTop = box.scrollHeight;
  }
  function run(line){
    /* echo with > / >> redirection is handled before normal parsing */
    const rd = line.match(/^echo\s+([\s\S]*?)\s*(>>?)\s*(\S+)$/);
    if(rd){
      const err = fsWrite(fsResolve(rd[3], st.cwd), rd[1].replace(/^"|"$/g, '') + '\n', rd[2] === '>>');
      if(err) printText(err, 'err'); else { refreshFiles(); refreshNotesList(); renderIcons(); }
      return;
    }
    const parts = line.split(/\s+/);
    const cmd = parts[0], args = parts.slice(1);
    const C = COMMANDS[cmd];
    if(!C){ printText('ksh: ' + cmd + ': command not found (try "help")', 'err'); return; }
    C.fn(args);
    box.scrollTop = box.scrollHeight;
  }
  const COMMANDS = {
    help: { d:'this list', fn(){
      const names = Object.keys(COMMANDS).sort();
      const wd = Math.max(...names.map(n => n.length)) + 3;
      names.forEach(n => print('<span class="acc">' + n.padEnd(wd) + '</span>' + esc(COMMANDS[n].d)));
    }},
    ls: { d:'list a directory', fn(a){
      const node = fsGet(a[0] ? fsResolve(a[0], st.cwd) : st.cwd);
      if(!node){ printText('no such path', 'err'); return; }
      if(node.type === 'file'){ printText(a[0]); return; }
      const names = Object.keys(node.children).sort((x, y) => {
        const X = node.children[x], Y = node.children[y];
        if(X.type !== Y.type) return X.type === 'dir' ? -1 : 1;
        return x.localeCompare(y);
      });
      if(!names.length){ printText('(empty)', 'dim'); return; }
      names.forEach(n => {
        const c = node.children[n];
        print(c.type === 'dir' ? '<span class="acc">' + esc(n) + '/</span>' : esc(n) +
          '<span class="dim">  ' + (c.type === 'file' ? c.content.length + ' B' : '') + '</span>');
      });
    }},
    cd: { d:'change directory', fn(a){
      const p = a[0] ? fsResolve(a[0], st.cwd) : HOME.slice();
      const node = fsGet(p);
      if(!node || node.type !== 'dir'){ printText('cd: no such directory: ' + (a[0] || '~'), 'err'); return; }
      st.cwd = p;
    }},
    pwd: { d:'print working directory', fn(){ printText(fsPathStr(st.cwd)); }},
    cat: { d:'print a file', fn(a){
      if(!a[0]){ printText('cat: which file?', 'err'); return; }
      const node = fsGet(fsResolve(a[0], st.cwd));
      if(!node){ printText('cat: no such file: ' + a[0], 'err'); return; }
      if(node.type === 'dir'){ printText('cat: is a directory: ' + a[0], 'err'); return; }
      printText(node.content || '(empty)');
    }},
    echo: { d:'print text; "> file" writes it', fn(a){ printText(a.join(' ').replace(/^"|"$/g, '')); }},
    mkdir: { d:'make a directory', fn(a){
      if(!a[0]){ printText('mkdir: name?', 'err'); return; }
      const err = fsMk(fsResolve(a[0], st.cwd), fdir());
      if(err) printText(err, 'err'); else { refreshFiles(); renderIcons(); }
    }},
    touch: { d:'make an empty file', fn(a){
      if(!a[0]){ printText('touch: name?', 'err'); return; }
      const p = fsResolve(a[0], st.cwd);
      if(fsGet(p)){ const n = fsGet(p); n.mtime = fsNow(); fsSave(); return; }
      const err = fsMk(p, ffile(''));
      if(err) printText(err, 'err'); else { refreshFiles(); refreshNotesList(); renderIcons(); }
    }},
    rm: { d:'remove (-r for directories)', fn(a){
      const rec = a[0] === '-r';
      const t = rec ? a[1] : a[0];
      if(!t){ printText('rm: what?', 'err'); return; }
      const err = fsRm(fsResolve(t, st.cwd), rec);
      if(err) printText(err, 'err'); else { refreshFiles(); refreshNotesList(); renderIcons(); }
    }},
    open: { d:'open an app or a .txt file', fn(a){
      if(!a[0]){ printText('open: browser|konekt|files|term|notes|kalc|settings, a path, or a URL', 'err'); return; }
      if(/^https?:\/\//i.test(a[0])){ openApp('web', { url: a[0] }); return; }
      const alias = { browser:'web', web:'web', kb:'web', konekt:'konekt', files:'files', term:'term', terminal:'term', notes:'notes', kalc:'calc', calc:'calc', settings:'set', set:'set' };
      if(alias[a[0].toLowerCase()]){ openApp(alias[a[0].toLowerCase()]); return; }
      const p = fsResolve(a[0], st.cwd);
      const node = fsGet(p);
      if(!node){ printText('open: no such path: ' + a[0], 'err'); return; }
      if(node.type === 'dir') openApp('files', { path: p });
      else openApp('notes', { path: p });
    }},
    wallpaper: { d:'wallpaper list|<name> — ten of them', fn(a){
      if(!a[0] || a[0] === 'list'){ wallKeys().forEach(k => printText((k === settings.wall ? '* ' : '  ') + k)); return; }
      if(wallKeys().indexOf(a[0]) < 0){ printText('no such wallpaper (try "wallpaper list")', 'err'); return; }
      KONEKT_LOOK.set({ wall: a[0] }); refreshSettings();
    }},
    theme: { d:'theme dark|light|system|glass|custom', fn(a){
      const modes = ['dark', 'light', 'system', 'glass', 'custom'];
      if(!a[0]){ modes.forEach(m => printText((m === settings.mode ? '* ' : '  ') + m)); return; }
      if(modes.indexOf(a[0]) < 0){ printText('no such colour scheme', 'err'); return; }
      KONEKT_LOOK.set({ mode: a[0] }); refreshSettings();
    }},
    date: { d:'the time on this side of the visor', fn(){ printText(new Date().toString()); }},
    whoami: { d:'you', fn(){ printText(user.name); }},
    hostname: { d:'this device', fn(){ printText('konekt.world (headset rev C)'); }},
    uname: { d:'kernel', fn(){ printText('KonektOS ' + OS_VERSION + ' swallow-6.1.0-nko cubic'); }},
    uptime: { d:'time since boot', fn(){
      const s = Math.floor((Date.now() - BOOT_T) / 1000);
      printText('up ' + Math.floor(s / 60) + ' min ' + (s % 60) + ' s');
    }},
    history: { d:'command history', fn(){ st.hist.forEach((h, i) => printText('  ' + (i + 1) + '  ' + h)); }},
    neofetch: { d:'device card', fn(){
      const info = [
        ['', ''],
        ['OS',       'KonektOS ' + OS_VERSION + ' (build ' + OS_BUILD + ')'],
        ['Host',     'KONEKT.WORLD headset rev C'],
        ['Kernel',   'swallow 6.1.0-nko'],
        ['Uptime',   Math.floor((Date.now() - BOOT_T) / 60000) + ' min'],
        ['Shell',    'ksh 1.4'],
        ['WM',       'KWM (' + (parseInt(settings.radius, 10) || 0) + 'px corners)'],
        ['Theme',    (settings.mode || 'dark') + ' / ' + settings.wall],
        ['Accent',   settings.accent],
        ['Browser',  'KONEKT BROWSER (preinstalled)'],
        ['Updates',  SYS ? ('live from ' + (SYS.origin || 'origin')) : 'simulated (running in a browser)'],
        ['Storage',  Math.max(1, Math.round(fsSizeOf(FS) / 102.4) / 10) + ' KB of ∞'],
        ['User',     user.name]
      ];
      const pad = ' '.repeat(NEOFETCH_ART[0].length);
      for(let i = 0; i < Math.max(NEOFETCH_ART.length, info.length); i++){
        const line = NEOFETCH_ART[i] || pad, kv = info[i] || ['', ''];
        print('<span class="acc">' + esc(line) + '</span>  ' +
          (kv[0] ? '<span class="grn">' + esc(kv[0].padEnd(9)) + '</span>' + esc(kv[1]) : ''));
      }
    }},
    lastochka: { d:'the assistant', fn(){
      printText('LASTOCHKA: no uplink on this build. I live in the KONEKT app —');
      printText('           open konekt and look for the swallow.', 'dim');
    }},
    update: { d:'check for a system update ("update preview" shows the dialog)', fn(a){
      if(a[0] === 'preview'){ previewUpdate(); return; }
      printText('checking version.json …', 'dim');
      checkUpdate({}).then(r => {
        if(!r || r.error){ printText('update server unreachable', 'err'); return; }
        if(r.newer) printText('update available: ' + r.info.version + ' — dialog opened');
        else printText('up to date — KONEKT OS ' + OS_VERSION + ' (build ' + OS_BUILD + ')', 'dim');
        box.scrollTop = box.scrollHeight;
      });
    }},
    keys: { d:'the keyboard map', fn(){
      const w2 = Math.max.apply(null, KEYMAP.map(k => k[0].length)) + 3;
      KEYMAP.forEach(k => print('<span class="acc">' + esc(k[0].padEnd(w2)) + '</span>' + esc(k[1])));
    }},
    space: { d:'space [1-4] — show or switch workspace', fn(a){
      if(!a[0]){ printText('workspace ' + (wm.space + 1) + ' of ' + SPACES); return; }
      const n = parseInt(a[0], 10);
      if(!(n >= 1 && n <= SPACES)){ printText('space: 1…' + SPACES, 'err'); return; }
      gotoSpace(n - 1);
    }},
    notify: { d:'notify <text> — raise a notification', fn(a){
      const body = a.join(' ').replace(/^"|"$/g, '');
      notify({ title: body || 'ksh', body: body ? '' : 'empty notification', icon: IC.term });
    }},
    clear: { d:'wipe the screen (also Ctrl+L)', fn(){ $$('.tl', box).forEach(x => x.remove()); }},
    exit: { d:'close the terminal', fn(){ const w2 = winFor('term'); if(w2) closeWin(w2); }},
    reboot: { d:'restart the headset', fn(){
      if(SYS && SYS.canPower){ printText('rebooting…', 'dim'); sysPost('/api/power', { action:'reboot' }).catch(() => {}); return; }
      closeAllWindows(); boot();
    }},
    shutdown: { d:'power off', fn(){ shutdown(); }}
  };
  box.addEventListener('click', () => { const i = $('.term-in', box); if(i && !getSelection().toString()) i.focus(); });
  print('<span class="dim">KonektOS ' + OS_VERSION + ' — ksh. Type "help" or "keys". Nothing here leaves the device.</span>');
  inputRow();
}

/* ---------- KALC ---------- */
function launchCalc(w){
  const KEYS = [
    ['C','(',')','÷'],
    ['7','8','9','×'],
    ['4','5','6','−'],
    ['1','2','3','+'],
    ['⌫','0','.','=']
  ];
  w.body.innerHTML =
    '<div class="kc" tabindex="0">' +
      '<div class="kc-out"></div><div class="kc-cur">0</div>' +
      '<div class="kc-grid">' +
        KEYS.flat().map(k =>
          '<button class="kc-b' + ('÷×−+()'.includes(k) || k === 'C' || k === '⌫' ? ' op' : '') + (k === '=' ? ' eq' : '') + '" data-k="' + k + '">' + k + '</button>').join('') +
      '</div>' +
    '</div>';
  const cur = $('.kc-cur', w.body), out = $('.kc-out', w.body), kc = $('.kc', w.body);
  let expr = '';
  function show(){ cur.textContent = expr || '0'; }
  function press(k){
    if(k === 'C'){ expr = ''; out.textContent = ''; show(); return; }
    if(k === '⌫'){ expr = expr.slice(0, -1); show(); return; }
    if(k === '='){
      const js = expr.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-');
      if(!js || !/^[0-9+\-*/(). %]+$/.test(js)){ out.textContent = 'ERR'; return; }
      try{
        const v = Function('"use strict";return (' + js + ')')();
        if(typeof v !== 'number' || !isFinite(v)){ out.textContent = '∞'; return; }
        out.textContent = expr + ' =';
        expr = String(Math.round(v * 1e10) / 1e10);
        show();
      }catch(e){ out.textContent = 'ERR'; }
      return;
    }
    if(expr.length > 40) return;
    expr += k;
    show();
  }
  $$('.kc-b', w.body).forEach(b => b.onclick = () => { press(b.dataset.k); kc.focus(); });
  kc.addEventListener('keydown', e => {
    const map = { '/':'÷', '*':'×', '-':'−', 'Enter':'=', '=':'=', 'Backspace':'⌫', 'Escape':'C', 'Delete':'C' };
    const k = map[e.key] || ('0123456789.+()'.includes(e.key) ? e.key : null);
    if(k){ e.preventDefault(); press(k); }
  });
  setTimeout(() => kc.focus(), 50);
}

let settingsRefresh = null;
function refreshSettings(){ if(settingsRefresh) settingsRefresh(); }
function launchSettings(w, arg){
  const st = { pane: (arg && arg.pane) || 'appearance' };
  w.body.innerHTML =
    '<div class="st">' +
      '<div class="st-nav">' +
        '<button class="st-ni" data-p="appearance">Appearance</button>' +
        '<button class="st-ni" data-p="account">Account</button>' +
        '<button class="st-ni" data-p="system">System</button>' +
      '</div>' +
      '<div class="st-main scroll"></div>' +
    '</div>';
  const main = $('.st-main', w.body);

  function sec(title){
    const d = el('<div class="st-sec"><h3 class="st-t">' + title + '</h3></div>');
    main.appendChild(d);
    return d;
  }
  function render(){
    $$('.st-ni', w.body).forEach(b => b.classList.toggle('on', b.dataset.p === st.pane));
    main.innerHTML = '';
    if(st.pane === 'appearance'){
      /* the universal KONEKT LOOK panel — the same rows as every product in the family */
      const lp = el('<div class="st-sec" id="lookPanel"></div>');
      const paint = () => { lp.innerHTML = KONEKT_LOOK.panel(LOOK_ROWS); decorateWalls(lp); };
      paint();
      main.appendChild(lp);
      KONEKT_LOOK.wire(lp, paint);
      main.insertAdjacentHTML('beforeend', '<div class="st-note">Void, Nebula, Grid and Orbit are drawn by the OS itself; every other wallpaper and every setting above is the family\'s — change it here and KONEKT, the browser, the mail and the rest wear it too.</div>');
    }
    if(st.pane === 'account'){
      const nm = sec('Display name');
      const f = el('<div class="st-field"><input class="st-in" maxlength="24" value="' + esc(user.name) + '"><button class="btn-line">Save</button></div>');
      $('button', f).onclick = () => {
        const v = $('input', f).value.trim();
        if(!v) return;
        user.name = v;
        store.set('kos.user', user);
        renderStartMenu();
        note('saved');
      };
      nm.appendChild(f);
      const noteEl = el('<div class="st-note"></div>');
      nm.appendChild(noteEl);
      function note(t){ noteEl.textContent = t; setTimeout(() => noteEl.textContent = '', 1800); }
      /* a local password, entirely optional */
      const pwSec = sec(TT('pwSection'));
      const paintPw = () => {
        pwSec.innerHTML = '<h3 class="st-t">' + TT('pwSection') + '</h3>' +
          '<div class="st-note" style="margin:0 0 10px">' + (pwIsSet() ? TT('pwSetTxt') : TT('pwNone')) + '</div>' +
          '<div class="st-field"><input class="st-in" type="password" placeholder="' + TT('pwNew') + '" autocomplete="new-password">' +
          '<button class="btn-line">' + TT('pwSave') + '</button>' +
          (pwIsSet() ? '<button class="btn-line danger">' + TT('pwRemove') + '</button>' : '') + '</div>' +
          '<div class="st-note">' + TT('pwNote') + '</div>';
        const field = $('input', pwSec), save = $('.btn-line', pwSec), rm = $('.btn-line.danger', pwSec);
        save.onclick = () => {
          if(!field.value){ field.focus(); return; }
          pwSet(field.value).then(() => { toast(TT('pwSetTxt'), 2200); paintPw(); });
        };
        if(rm) rm.onclick = () => pwSet(null).then(() => { toast(TT('pwNone'), 2200); paintPw(); });
        field.onkeydown = e => { if(e.key === 'Enter') save.click(); e.stopPropagation(); };
      };
      paintPw();

      /* KONEKT SSO is an extra, never a requirement */
      const idSec = sec('KONEKT');
      const paintId = () => {
        idSec.innerHTML = '<h3 class="st-t">KONEKT</h3>' +
          (ME
            ? '<div class="about-row"><span class="k">signed in</span><span class="v">@' + esc(ME.preferred_username || ME.sub || '') + '</span></div>' +
              '<div class="st-field" style="margin-top:10px"><button class="btn-line">' + TT('signOut') + '</button></div>'
            : '<div class="st-field"><button class="btn-line">' + TT('signIn') + '</button></div>') +
          '<div class="st-note">' + TT('ssoOptionalNote') + '</div>';
        $('.btn-line', idSec).onclick = () => { ME ? ssoLogout() : ssoLogin(); setTimeout(paintId, 400); };
      };

      sec('Identity').insertAdjacentHTML('beforeend',
        '<div class="about-row"><span class="k">home</span><span class="v">/home/user</span></div>' +
        '<div class="about-row"><span class="k">since</span><span class="v">' + new Date(user.created || Date.now()).toLocaleDateString() + '</span></div>' +
        '<div class="st-note">The account is local to this headset. KONEKT itself signs in separately, inside its own app.</div>');
    }
    if(st.pane === 'system'){
      const mins = Math.floor((Date.now() - BOOT_T) / 60000);
      sec('About this headset').insertAdjacentHTML('beforeend',
        '<div class="about-row"><span class="k">device</span><span class="v">KONEKT.WORLD headset rev C</span></div>' +
        '<div class="about-row"><span class="k">os</span><span class="v">KonektOS ' + OS_VERSION + ' (build ' + OS_BUILD + ')</span></div>' +
        '<div class="about-row"><span class="k">kernel</span><span class="v">swallow 6.1.0-nko</span></div>' +
        '<div class="about-row"><span class="k">browser</span><span class="v">KONEKT BROWSER · preinstalled, default</span></div>' +
        '<div class="about-row"><span class="k">uptime</span><span class="v">' + (mins < 1 ? 'under a minute' : mins + ' min') + '</span></div>' +
        '<div class="about-row"><span class="k">local files</span><span class="v">' + Math.max(1, Math.round(fsSizeOf(FS) / 102.4) / 10) + ' KB</span></div>' +
        '<div class="about-row"><span class="k">foundation</span><span class="v">NKO Intl. Foundation of Technological Research &amp; Development</span></div>');

      const kb = sec(TT('keyboard'));
      kb.insertAdjacentHTML('beforeend',
        '<div class="keys">' + KEYMAP.map(k =>
          '<kbd>' + esc(k[0]) + '</kbd><span>' + esc(k[1]) + '</span>').join('') + '</div>' +
        '<div class="st-note">Alt+Tab and the Super key belong to the machine you are on when KONEKT OS runs in a ' +
        'browser tab, so the window switcher also answers to Alt+` and search to Ctrl+Space.</div>');

        const dp = sec('Display');

          const box = $('#dispModes', dp);

            if(!d.ok) throw 0;
            const cur = d.current || {};
            const COMMON = [[1280,800],[1366,768],[1600,900],[1680,1050],[1920,1080],[2560,1440]];
            const offered = d.modes.map(m => [m.w, m.h]);
            const all = [];
            COMMON.concat(offered).forEach(([w, h]) => {
              if(!all.some(x => x[0] === w && x[1] === h)) all.push([w, h]);
            });
            all.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
            box.innerHTML = '<div class="disp-grid">' + all.map(([w, h]) => {
              const on = cur.w === w && cur.h === h;

              if(b.classList.contains('on')) return;

                .then(() => { toast(b.dataset.w + '\u00d7' + b.dataset.h, 2200); setTimeout(paintDisp, 600); })
                .catch(e => { toast(String(e.message || e), 3000); paintDisp(); });
            });
          }).catch(() => { box.innerHTML = '<div class="st-note">Display control is not available here.</div>'; });
        };
        paintDisp();
      }

      if(SYS){
        const appsSec = sec(TT('installedApps'));
        fetch('/api/apps', { cache:'no-store' }).then(r => r.json()).then(d => {
          if(!d.ok) throw 0;
          appsSec.innerHTML = '<h3 class="st-t">' + TT('installedApps') + '</h3>' +
            d.apps.map(a =>
              '<div class="about-row"><span class="k">' + esc(a.name) + '</span><span class="v">' +
              (a.installed ? 'application' : 'web') + (a.source ? ' · source' : '') + '</span></div>').join('') +
            '<div class="st-note">' + TT('appsNote') + '</div>';

      const sw2 = sec('Software update');
      const upRow = el('<div class="st-field"></div>');
      const upBtn = el('<button class="btn-line">Check for updates</button>');
      upBtn.onclick = () => {
        upBtn.disabled = true;
        upBtn.textContent = 'Checking…';
        checkUpdate({ loud:true }).then(() => {
          upBtn.disabled = false;
          upBtn.textContent = 'Check for updates';
        });
      };
      const prevBtn = el('<button class="btn-line">See the update dialog</button>');
      prevBtn.onclick = () => previewUpdate();
      upRow.appendChild(upBtn); upRow.appendChild(prevBtn);
      sw2.appendChild(upRow);
      if(SYS) sw2.insertAdjacentHTML('beforeend',
        '<div class="about-row"><span class="k">update origin</span><span class="v">' + esc(SYS.origin || '') + '</span></div>');
      sw2.insertAdjacentHTML('beforeend',
        '<div class="st-note">KONEKT OS checks for a new build every time it starts, on a phone exactly as on a desktop. ' +
        'It never installs anything without asking: you get the release notes and a choice. Updates are atomic — the new system ' +
        'is written to the free slot and switched on whole, so a bad build is undone by a reboot.</div>');

      const pw = sec('Power');
      const rowP = el('<div class="st-field"></div>');
      const rb = el('<button class="btn-line">Reboot</button>');
      rb.onclick = () => {
        if(SYS && SYS.canPower){ toast('Перезагрузка…', 4000); sysPost('/api/power', { action:'reboot' }).catch(() => {}); return; }
        closeAllWindows(); boot();
      };
      const sd = el('<button class="btn-line">Shut down</button>');
      sd.onclick = () => shutdown();
      rowP.appendChild(rb); rowP.appendChild(sd);
      pw.appendChild(rowP);
      const dz = sec('Danger');
      const er = el('<button class="btn-line danger">Erase this device</button>');
      let armed = false;
      er.onclick = () => {
        if(!armed){ armed = true; er.textContent = 'Click again — every file goes'; return; }
        factoryReset();
      };
      dz.appendChild(er);
      dz.insertAdjacentHTML('beforeend', '<div class="st-note">Erasing removes the account, the files and the settings from this browser. There is no cloud copy; that is the point.</div>');
    }
  }
  $$('.st-ni', w.body).forEach(b => b.onclick = () => { st.pane = b.dataset.p; render(); });
  w.onArg = a => { if(a && a.pane){ st.pane = a.pane; render(); } };
  settingsRefresh = render;
  w.onClose = () => { if(settingsRefresh === render) settingsRefresh = null; };
  render();
}

/* ---------------------------- workspaces ---------------------------- */
const SPACES = 4;
let mruSeq = 1;
function spaceOf(w){ return w.space || 0; }
function winsOnSpace(n){ return wm.wins.filter(w => spaceOf(w) === n); }
function renderSpaces(){
  const box = $('#spaces');
  if(!box) return;
  box.innerHTML = '';
  for(let i = 0; i < SPACES; i++){
    const has = winsOnSpace(i).length > 0;
    const b = el('<button class="sp-pip' + (i === wm.space ? ' on' : '') + (has ? ' has' : '') + '"' +
      ' aria-label="' + TT('space') + ' ' + (i + 1) + '" aria-pressed="' + (i === wm.space) + '">' + (i + 1) + '</button>');
    b.onclick = e => { e.stopPropagation(); gotoSpace(i); };
    box.appendChild(b);
  }
}
function syncSpaces(){
  wm.wins.forEach(w => w.el.classList.toggle('offspace', spaceOf(w) !== wm.space));
  renderSpaces();
  tbSync();
}
function gotoSpace(n, quiet){
  n = ((n % SPACES) + SPACES) % SPACES;
  if(n === wm.space) return;
  wm.space = n;
  syncSpaces();
  const t = topWin();
  if(t) focusWin(t);
  if(!quiet) toast(TT('space') + ' ' + (n + 1), 1400);
}
function moveActiveToSpace(n){
  const w = topWin();
  if(!w) return;
  n = ((n % SPACES) + SPACES) % SPACES;

    atList = winsOnSpace(wm.space).slice().sort((a, b) => (b.mru || 0) - (a.mru || 0));

/* ---------------------------- tiling ---------------------------- */
function tileActive(mode){
  const w = topWin();
  if(!w || isSmall()) return;
  const desk = $('#desk');
  if(mode === 'max'){ maxWin(w, true); return; }
  if(mode === 'restore'){ if(w.maxed) maxWin(w, false); else minWin(w); return; }
  if(w.maxed) maxWin(w, false);
  const r = snapRect(mode, desk.clientWidth, desk.clientHeight);
  if(!r) return;
  w.restoreRect = { l: w.el.offsetLeft, t: w.el.offsetTop, w: w.el.offsetWidth, h: w.el.offsetHeight };
  Object.assign(w.el.style, { left: r.l + 'px', top: r.t + 'px', width: r.w + 'px', height: r.h + 'px' });
}

/* ---------------------------- universal search ---------------------------- */
let seItems = [], seSel = 0;
function fsSearch(q, limit){
  const out = [], ql = q.toLowerCase();
  (function walk(parts, depth){
    if(out.length >= limit || depth > 4) return;
    const node = fsGet(parts);
    if(!node || node.type !== 'dir') return;
    Object.keys(node.children).sort().forEach(name => {
      if(out.length >= limit) return;
      const c = node.children[name];
      if(name.toLowerCase().indexOf(ql) >= 0) out.push({ name, parts: parts.concat(name), node: c });
      if(c.type === 'dir') walk(parts.concat(name), depth + 1);
    });
  })([], 0);
  return out;
}
function searchBuild(q){
  const items = [];
  const ql = q.trim().toLowerCase();
  const hit = t => !ql || String(t).toLowerCase().indexOf(ql) >= 0;

  Object.entries(APPS).forEach(([id, a]) => {
    if(hit(a.name)) items.push({ g: TT('apps'), t: a.name, s: '', icon: a.icon, run: () => openApp(id) });
  });

  if(ql){
    fsSearch(ql, 6).forEach(f => items.push({
      g: TT('files'), t: f.name, s: fsTilde(f.parts.slice(0, -1)),
      icon: f.node.type === 'dir' ? IC.files : IC.file,
      run: () => f.node.type === 'dir' ? openApp('files', { path: f.parts }) : openApp('notes', { path: f.parts })
    }));
  }

  [['Appearance', 'appearance'], ['Account', 'account'], ['System', 'system']].forEach(pane => {
    if(hit(pane[0])) items.push({
      g: TT('settings'), t: pane[0], s: 'Settings', icon: IC.set,
      run: () => openApp('set', { pane: pane[1] })
    });
  });

  const acts = [
    [TT('openTerm'), IC.term, () => openApp('term')],
    [TT('openBrowser'), IC.browser, () => openApp('web')],
    [TT('chkUpd'), IC.globe, () => checkUpdate({ loud:true })],
    [TT('showDesk'), IC.grid4, () => showDesktop()],
    [TT('dark'), IC.moon, () => KONEKT_LOOK.set({ mode:'dark' })],
    [TT('light'), IC.sun, () => KONEKT_LOOK.set({ mode:'light' })],
    [TT('glass'), IC.sliders, () => KONEKT_LOOK.set({ mode:'glass' })],
    [TT('lock'), IC.lock, () => lock()],
    [ME ? TT('signOut') : TT('signIn'), IC.person, () => ME ? ssoLogout() : ssoLogin()],
    [TT('reboot'), IC.restart, () => { closeAllWindows(); boot(); }],
    [TT('shutdown'), IC.power, () => shutdown()]
  ];
  acts.forEach(a => { if(hit(a[0])) items.push({ g: TT('actions'), t: a[0], s: '', icon: a[1], run: a[2] }); });

  if(ql){
    items.push({
      g: TT('web'), t: TT('searchWeb') + ': ' + q.trim(), s: 'KONEKT BROWSER', icon: IC.search,
      run: () => openApp('web', { url: 'https://yandex.ru/search/?text=' + encodeURIComponent(q.trim()) })
    });
  }
  return items.slice(0, 24);
}
function searchRender(){
  const list = $('#search .se-list');
  if(!list) return;
  if(!seItems.length){ list.innerHTML = '<div class="se-empty">' + TT('nothing') + '</div>'; return; }
  let html = '', group = null;
  seItems.forEach((it, i) => {
    if(it.g !== group){ group = it.g; html += '<div class="se-group">' + esc(group) + '</div>'; }
    html += '<button class="se-i' + (i === seSel ? ' sel' : '') + '" data-i="' + i + '">' +
      '<span class="ic">' + it.icon + '</span><span class="tx"><span class="t">' + esc(it.t) + '</span>' +
      (it.s ? '<span class="s">' + esc(it.s) + '</span>' : '') + '</span></button>';
  });
  list.innerHTML = html;
  $$('.se-i', list).forEach(b => b.onclick = () => { seSel = +b.dataset.i; searchRun(); });
  const sel = $('.se-i.sel', list);
  if(sel && sel.scrollIntoView) sel.scrollIntoView({ block:'nearest' });
}
function searchRun(){
  const it = seItems[seSel];
  searchClose();
  if(it && it.run) try{ it.run(); }catch(e){}
}
function searchClose(){
  const box = $('#search');
  box.classList.remove('on');
  box.innerHTML = '';
}
function searchOpen(prefill){
  const box = $('#search');
  toggleStart(false); qsToggle(false); ncToggle(false); hideCMenu();
  box.innerHTML =
    '<div class="se-card">' +
      '<div class="se-top">' + IC.search +
        '<input class="se-in" id="seIn" placeholder="' + TT('searchPh') + '" autocomplete="off" spellcheck="false" aria-label="' + TT('search') + '">' +
      '</div>' +
      '<div class="se-list"></div>' +
      '<div class="se-foot"><span>↑↓ ' + TT('navigate') + '</span><span>⏎ ' + TT('open') + '</span><span>ESC ' + TT('close') + '</span></div>' +
    '</div>';
  box.classList.add('on');
  const inp = $('#seIn', box);
  const refresh = () => { seItems = searchBuild(inp.value); seSel = 0; searchRender(); };
  inp.oninput = refresh;
  inp.onkeydown = e => {
    if(e.key === 'ArrowDown'){ e.preventDefault(); seSel = Math.min(seSel + 1, seItems.length - 1); searchRender(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); seSel = Math.max(seSel - 1, 0); searchRender(); }
    else if(e.key === 'Enter'){ e.preventDefault(); searchRun(); }
    else if(e.key === 'Escape'){ e.preventDefault(); searchClose(); }
    e.stopPropagation();
  };
  box.onclick = e => { if(e.target === box) searchClose(); };
  if(prefill) inp.value = prefill;
  refresh();
  setTimeout(() => inp.focus(), 20);
}

      return;
    }
    if(e.code === 'Space' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); searchOpen(); return; }
    /* the Super key, GNOME-style: a lone tap opens search, chords do work.
       In a browser tab the host OS usually owns Super; in the kiosk it is ours. */
    if(e.key === 'Meta'){ superDown = true; superUsed = false; e.preventDefault(); return; }
    if(superDown && e.metaKey !== false){
      superUsed = true;
      if(e.key === 'Tab'){ e.preventDefault(); atStep(e.shiftKey ? -1 : 1); return; }
      const kk = (e.key || '').toLowerCase();
      if(kk === 'a'){ e.preventDefault(); toggleStart(); return; }
      if(kk === 'd'){ e.preventDefault(); showDesktop(); return; }
      if(kk === 'l'){ e.preventDefault(); lock(); return; }
      if(e.key === 'ArrowLeft'){ e.preventDefault(); tileActive('left'); return; }
      if(e.key === 'ArrowRight'){ e.preventDefault(); tileActive('right'); return; }
      if(e.key === 'ArrowUp'){ e.preventDefault(); tileActive('max'); return; }
      if(e.key === 'ArrowDown'){ e.preventDefault(); tileActive('restore'); return; }
      if(e.key === 'PageUp'){ e.preventDefault(); gotoSpace(wm.space - 1); return; }
      if(e.key === 'PageDown'){ e.preventDefault(); gotoSpace(wm.space + 1); return; }
    }
    if(e.altKey && e.key === 'F2'){ e.preventDefault(); searchOpen(); return; }
    if(e.altKey && e.key === 'F4'){ e.preventDefault(); const w0 = topWin(); if(w0) closeWin(w0); return; }
    if(e.altKey && e.key === 'F10'){ e.preventDefault(); const w0 = topWin(); if(w0) maxWin(w0, !w0.maxed); return; }
    if(e.altKey && (e.key === 'Tab' || e.code === 'Backquote')){ e.preventDefault(); atStep(e.shiftKey ? -1 : 1); return; }
    if(e.ctrlKey && e.altKey){
      const k = (e.key || '').toLowerCase();
      if(k === 't'){ e.preventDefault(); openApp('term'); return; }
      if(k === 'b'){ e.preventDefault(); openApp('web'); return; }
      if(k === 'd'){ e.preventDefault(); showDesktop(); return; }
      if(e.key === 'ArrowRight'){ e.preventDefault(); e.shiftKey ? moveActiveToSpace(wm.space + 1) : gotoSpace(wm.space + 1); return; }
      if(e.key === 'ArrowLeft'){ e.preventDefault(); e.shiftKey ? moveActiveToSpace(wm.space - 1) : gotoSpace(wm.space - 1); return; }
      if(/^[1-4]$/.test(e.key)){ e.preventDefault(); gotoSpace(+e.key - 1); return; }
    }
    if(e.altKey && e.shiftKey && !typing){
      if(e.key === 'ArrowLeft'){ e.preventDefault(); tileActive('left'); return; }
      if(e.key === 'ArrowRight'){ e.preventDefault(); tileActive('right'); return; }
      if(e.key === 'ArrowUp'){ e.preventDefault(); tileActive('max'); return; }
      if(e.key === 'ArrowDown'){ e.preventDefault(); tileActive('restore'); return; }
    }
  });
  document.addEventListener('keyup', e => {
    if(e.key === 'Alt') atCommit();
    if(e.key === 'Meta'){
      if(superDown && !superUsed && !atOpen){
        if($('#search').classList.contains('on')) searchClose(); else searchOpen();
      }
      superDown = false; superUsed = false;
      atCommit();
    }
  });
  addEventListener('blur', () => atCommit());
  addEventListener('online', uplinkSync);
  addEventListener('offline', uplinkSync);
  addEventListener('resize', () => {
    /* keep windows reachable when the desk shrinks */
    const desk = $('#desk');
    wm.wins.forEach(w => {
      if(w.maxed) return;
      if(w.el.offsetLeft > desk.clientWidth - 60) w.el.style.left = Math.max(0, desk.clientWidth - w.el.offsetWidth) + 'px';
      if(w.el.offsetTop > desk.clientHeight - 30) w.el.style.top = Math.max(0, desk.clientHeight - w.el.offsetHeight) + 'px';
    });
  });
  uplinkSync();
  applyScreen(false);
  badgeSync();
  syncSpaces();
  tbSync();
}

/* ---------------------------- init ---------------------------- */
fsLoad();
applyDesk(settings);
applyScreen(false);
setInterval(clockTick, 1000);
clockTick();
boot();
</script>
</body>
</html>
