<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KONEKT OS</title>
<meta name="description" content="KONEKT OS — the operating environment of the KONEKT.WORLD headset. NKO Intl. Foundation of Technological Research &amp; Development.">
<meta name="theme-color" content="#000000">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="-56 -56 112 112"><rect x="-56" y="-56" width="112" height="112" fill="black"/><g fill="none" stroke="white" stroke-width="7.4"><circle r="50"/><ellipse rx="18" ry="50"/><ellipse rx="36.5" ry="50"/><line y1="-50" y2="50"/><line x1="-48.7" y1="0" x2="48.7" y2="0"/><line x1="-43.8" y1="21.5" x2="43.8" y2="21.5"/><line x1="-43.8" y1="-21.5" x2="43.8" y2="-21.5"/></g></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<!-- KONEKT LOOK — shared verbatim from konekt-kouch/public/konekt-look.js; do not edit here -->
<script>
/* =====================================================================
   KONEKT LOOK — one appearance for the whole family.
   ---------------------------------------------------------------------
   Every KONEKT product ships this file verbatim (inlined or linked). It
   owns the appearance settings, the colour maths, the CSS variables and
   data-attributes every product already reads, the migration from each
   product's old keys, the settings panel markup, and the hooks a product
   uses to sync the look through the account.

   The settings object (KONEKT_LOOK.get()):
     mode     'dark' | 'light' | 'system' | 'glass' | 'custom'
     bgCol, lineCol, textCol   '' or #rrggbb   (custom mode; picking one forces custom)
     accent   #rrggbb                           (seven presets + any colour)
     fs       's' | 'm' | 'l'                   (text size)
     radius   0..24                             (px, step 2; 0 = cubic)
     avRound  boolean                           (round avatars)
     caps     boolean                           (uppercase labels)
     motion   boolean                           (false = reduced)
     wall     'none' | aurora | ember | mono | teal | violet | void | nebula | grid | orbit
     density  'cozy' | 'compact'
     lang     'en' | 'ru'                       (interface language)

   What it writes on <html>:
     data-theme=dark|light (resolved), data-appearance=<mode>, data-fs, data-caps=on|off,
     data-motion=on|off, data-round=full|square (avatars), data-density, data-wall-on=1|0,
     data-lang, lang=; and the variables --accent, --radius, --av-radius, --wall, plus
     --bg/--hover/--hover-2/--line/--line-2/--line-3/--text in custom mode.
   Storage: localStorage 'konekt_look' (same key in every product). Sync: connect().
   ===================================================================== */
(function (root) {
  'use strict';
  var KEY = 'konekt_look';
  var DEFAULTS = {
    mode: 'dark', bgCol: '', lineCol: '', textCol: '', accent: '#1d9bf0',
    fs: 'm', radius: 0, avRound: false, caps: true, motion: true,
    wall: 'none', density: 'cozy', lang: '',
  };
  var ACCENTS = [
    ['#1d9bf0', 'Sky'], ['#00ba7c', 'Mint'], ['#f91880', 'Rose'], ['#ffd400', 'Gold'],
    ['#a970ff', 'Violet'], ['#ff6a00', 'Ember'], ['#ffffff', 'Ink'],
  ];
  var WALLS = {
    none: '',
    aurora: 'radial-gradient(120% 120% at 20% 0%, #10233b 0%, #0a0a12 45%, #000 100%), radial-gradient(90% 90% at 100% 100%, #241033 0%, transparent 60%)',
    ember: 'radial-gradient(120% 120% at 0% 0%, #2a0f0f 0%, #0a0708 45%, #000 100%), radial-gradient(90% 90% at 100% 30%, #3a1d05 0%, transparent 60%)',
    mono: 'radial-gradient(120% 120% at 50% 0%, #1a1a1a 0%, #0a0a0a 50%, #000 100%)',
    teal: 'radial-gradient(120% 120% at 15% 10%, #06272b 0%, #06131a 45%, #000 100%), radial-gradient(80% 80% at 100% 100%, #0b3a2e 0%, transparent 60%)',
    violet: 'radial-gradient(120% 120% at 80% 0%, #1a1040 0%, #0a0816 45%, #000 100%), radial-gradient(90% 90% at 0% 100%, #3a0f36 0%, transparent 60%)',
    void: 'radial-gradient(100% 100% at 50% 50%, #050505 0%, #000 100%)',
    nebula: 'radial-gradient(60% 80% at 30% 20%, #1b1037 0%, transparent 60%), radial-gradient(50% 60% at 75% 70%, #0b2a3a 0%, transparent 60%), #000',
    grid: 'linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px) 0 0/40px 40px, linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px) 0 0/40px 40px, #000',
    orbit: 'radial-gradient(circle at 50% 120%, rgba(29,155,240,.25) 0%, transparent 55%), #000',
  };
  var WALL_NAMES = { none: 'None', aurora: 'Aurora', ember: 'Ember', mono: 'Mono', teal: 'Teal', violet: 'Violet', void: 'Void', nebula: 'Nebula', grid: 'Grid', orbit: 'Orbit' };

  /* ---------------- colour maths — identical in every product ---------------- */
  function hex2rgb(h){ h = String(h || '').trim(); var m = /^#?([0-9a-f]{6})$/i.exec(h); if (!m) { var s = /^#?([0-9a-f]{3})$/i.exec(h); if (!s) return null; m = [0, s[1][0] + s[1][0] + s[1][1] + s[1][1] + s[1][2] + s[1][2]]; } var n = parseInt(m[1], 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgb2hex(c){ return '#' + c.map(function (v) { return ('0' + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2); }).join(''); }
  function luma(h){ var c = hex2rgb(h); return c ? (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 : 0; }
  function mixHex(a, b, t){ var x = hex2rgb(a), y = hex2rgb(b); if (!x || !y) return a; return rgb2hex([0, 1, 2].map(function (i) { return x[i] + (y[i] - x[i]) * t; })); }
  function contrast(a, b){ var la = luma(a), lb = luma(b); var hi = Math.max(la, lb), lo = Math.min(la, lb); return (hi + 0.05) / (lo + 0.05); }
  function prefersLight(){ return !!(root.matchMedia && root.matchMedia('(prefers-color-scheme: light)').matches); }

  /* ---------------- state ---------------- */
  var look = null, listeners = [], sync = null, saveT = null;
  function clean(o){
    var out = {};
    for (var k in DEFAULTS) if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) out[k] = DEFAULTS[k];
    if (!o || typeof o !== 'object') return out;
    if (['dark', 'light', 'system', 'glass', 'custom'].indexOf(o.mode) >= 0) out.mode = o.mode;
    ['bgCol', 'lineCol', 'textCol'].forEach(function (k) { out[k] = hex2rgb(o[k]) ? rgb2hex(hex2rgb(o[k])) : ''; });
    out.accent = hex2rgb(o.accent) ? rgb2hex(hex2rgb(o.accent)) : DEFAULTS.accent;
    if (['s', 'm', 'l'].indexOf(o.fs) >= 0) out.fs = o.fs;
    var r = Number(o.radius); if (isFinite(r)) out.radius = Math.max(0, Math.min(24, Math.round(r / 2) * 2));
    if (typeof o.avRound === 'boolean') out.avRound = o.avRound; else if (o.avRound === 'on' || o.avRound === 'off') out.avRound = o.avRound === 'on';
    if (typeof o.caps === 'boolean') out.caps = o.caps; else if (o.caps === 'on' || o.caps === 'off') out.caps = o.caps === 'on';
    if (typeof o.motion === 'boolean') out.motion = o.motion; else if (o.motion === 'on' || o.motion === 'off') out.motion = o.motion === 'on';
    if (WALLS.hasOwnProperty(o.wall)) out.wall = o.wall;
    if (o.density === 'compact' || o.density === 'cozy') out.density = o.density;
    if (o.lang === 'en' || o.lang === 'ru') out.lang = o.lang;
    for (var k2 in o) if (Object.prototype.hasOwnProperty.call(o, k2) && !(k2 in out)) out[k2] = o[k2];   /* keep what a newer product wrote */
    return out;
  }
  function read(){ try { return JSON.parse(root.localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function write(){ try { root.localStorage.setItem(KEY, JSON.stringify(look)); } catch (e) {} }

  /* ---------------- migration from every product's old keys ----------------
     Runs once, only when konekt_look is absent. Each product passes what it
     used to store; whatever it recognises becomes the first universal look. */
  function migrate(legacy){
    var o = {};
    if (!legacy) return o;
    var mode = legacy.mode || legacy.theme;
    if (mode === 'geek') mode = 'dark';
    if (mode === '' ) mode = 'dark';
    if (mode) o.mode = mode;
    if (legacy.accent) o.accent = legacy.accent;
    ['bgCol', 'lineCol', 'textCol'].forEach(function (k) { if (legacy[k]) o[k] = legacy[k]; });
    if (legacy.fs) o.fs = legacy.fs;
    if (legacy.radius !== undefined) o.radius = Number(legacy.radius) || 0;
    else if (legacy.round) o.radius = { cubic: 0, soft: 6, round: 12 }[legacy.round] || 0;
    if (legacy.avRound !== undefined) o.avRound = legacy.avRound === true || legacy.avRound === 'on';
    if (legacy.caps !== undefined) o.caps = legacy.caps === true || legacy.caps === 'on';
    if (legacy.motion !== undefined) o.motion = legacy.motion === true || legacy.motion === 'on';
    if (legacy.wall || legacy.wallpaper) { var w = legacy.wall || legacy.wallpaper; if (WALLS.hasOwnProperty(w)) o.wall = w; }
    if (legacy.density) o.density = legacy.density;
    if (legacy.lang === 'ru' || legacy.lang === 'en') o.lang = legacy.lang;
    return o;
  }

  /* ---------------- apply ---------------- */
  function apply(){
    var r = root.document.documentElement, s = look;
    var base = s.mode === 'light' ? 'light' : s.mode === 'dark' || s.mode === 'glass' ? 'dark' : s.mode === 'system' ? (prefersLight() ? 'light' : 'dark')
      : (s.bgCol ? (luma(s.bgCol) > 0.5 ? 'light' : 'dark') : (prefersLight() ? 'light' : 'dark'));
    r.setAttribute('data-theme', base);
    r.setAttribute('data-appearance', s.mode);
    var st = r.style;
    ['--bg', '--hover', '--hover-2', '--line', '--line-2', '--line-3', '--text', '--text-2', '--dim', '--dim-2', '--btn-h'].forEach(function (v) { st.removeProperty(v); });
    if (s.mode === 'custom') {
      var ink = s.textCol || (base === 'light' ? '#000000' : '#ffffff');
      if (s.bgCol) { st.setProperty('--bg', s.bgCol); st.setProperty('--hover', mixHex(s.bgCol, ink, 0.06)); st.setProperty('--hover-2', mixHex(s.bgCol, ink, 0.12)); }
      if (s.lineCol) { st.setProperty('--line', s.lineCol); st.setProperty('--line-2', mixHex(s.lineCol, ink, 0.35)); st.setProperty('--line-3', mixHex(s.lineCol, s.bgCol || (base === 'light' ? '#ffffff' : '#0a0b0d'), 0.55)); }
      if (s.textCol) { st.setProperty('--text', s.textCol); st.setProperty('--text-2', mixHex(s.textCol, s.bgCol || (base === 'light' ? '#ffffff' : '#000000'), 0.15)); st.setProperty('--dim', mixHex(s.textCol, s.bgCol || (base === 'light' ? '#ffffff' : '#000000'), 0.4)); st.setProperty('--dim-2', mixHex(s.textCol, s.bgCol || (base === 'light' ? '#ffffff' : '#000000'), 0.57)); st.setProperty('--btn-h', mixHex(s.textCol, s.bgCol || '#000000', 0.16)); }
    }
    st.setProperty('--accent', s.accent || DEFAULTS.accent);
    r.setAttribute('data-fs', s.fs);
    st.setProperty('--radius', (s.radius || 0) + 'px');
    st.setProperty('--av-radius', s.avRound ? '50%' : (s.radius || 0) + 'px');
    r.setAttribute('data-round', s.avRound ? 'full' : 'square');
    r.setAttribute('data-caps', s.caps ? 'on' : 'off');
    r.setAttribute('data-motion', s.motion ? 'on' : 'off');
    r.setAttribute('data-density', s.density);
    var wall = s.mode === 'glass' && s.wall === 'none' ? WALLS.aurora : WALLS[s.wall] || '';
    if (wall) { st.setProperty('--wall', wall); r.setAttribute('data-wall-on', '1'); } else { st.removeProperty('--wall'); r.setAttribute('data-wall-on', '0'); }
    var lang = s.lang || detectLang();
    r.setAttribute('data-lang', lang); r.setAttribute('lang', lang);
    var meta = root.document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', s.mode === 'custom' && s.bgCol ? s.bgCol : base === 'light' ? '#ffffff' : '#000000');
    listeners.forEach(function (fn) { try { fn(look); } catch (e) {} });
  }
  function detectLang(){ return ((root.navigator && root.navigator.language) || '').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en'; }

  /* ---------------- public surface ---------------- */
  var API = {
    KEY: KEY, DEFAULTS: DEFAULTS, ACCENTS: ACCENTS, WALLS: WALLS, WALL_NAMES: WALL_NAMES,
    hex2rgb: hex2rgb, rgb2hex: rgb2hex, luma: luma, mixHex: mixHex, contrast: contrast, prefersLight: prefersLight,
    /* init(legacy?) — load konekt_look, or migrate the product's old settings, then apply. Safe to call once at boot. */
    init: function (legacy) {
      var saved = read();
      look = clean(saved || migrate(legacy));
      if (!saved) write();
      apply();
      if (root.matchMedia) { var mql = root.matchMedia('(prefers-color-scheme: light)'); var h = function () { if (look.mode === 'system' || (look.mode === 'custom' && !look.bgCol)) apply(); }; if (mql.addEventListener) mql.addEventListener('change', h); else if (mql.addListener) mql.addListener(h); }
      root.addEventListener('storage', function (e) { if (e.key === KEY && e.newValue) { look = clean(read()); apply(); } });
      return look;
    },
    get: function () { return look || (look = clean(read())); },
    lang: function () { return (API.get().lang) || detectLang(); },
    /* set(patch, {silent}) — merge, persist, apply, and schedule a sync push */
    set: function (patch, opts) {
      var next = {};
      for (var k in look) if (Object.prototype.hasOwnProperty.call(look, k)) next[k] = look[k];
      for (var p in patch) if (Object.prototype.hasOwnProperty.call(patch, p)) next[p] = patch[p];
      if (patch && (patch.bgCol || patch.lineCol || patch.textCol) && !patch.mode) next.mode = 'custom';
      look = clean(next); write(); apply();
      if (sync && !(opts && opts.silent)) { clearTimeout(saveT); saveT = setTimeout(function () { sync.save(look).catch(function () {}); }, 800); }
      return look;
    },
    reset: function () { var lang = look.lang; look = clean({ lang: lang }); write(); apply(); if (sync) sync.save(look).catch(function () {}); return look; },
    apply: apply,
    onChange: function (fn) { listeners.push(fn); },
    /* connect({ load: () => Promise<look|null>, save: (look) => Promise }) — the account road.
       Pulls once: a newer remote record wins over this device; otherwise this device's look is pushed. */
    connect: function (hooks) {
      sync = hooks;
      return hooks.load().then(function (remote) {
        if (remote && typeof remote === 'object' && Object.keys(remote).length) { var mine = look; look = clean(remote); if (mine.lang && !look.lang) look.lang = mine.lang; write(); apply(); }
        else return hooks.save(look);
      }).catch(function () {});
    },
    disconnect: function () { sync = null; },

    /* ---------------- settings panel — the same rows in every product ---------------- */
    T: function (k) { var L = API.lang(); var d = API.DICT[L]; return (d && d[k]) || k; },
    DICT: {
      en: {},
      ru: {
        'Appearance': 'Оформление', 'Colour scheme': 'Цветовая схема', 'Dark': 'Тёмная', 'Light': 'Светлая', 'System': 'Системная', 'Liquid Glass': 'Liquid Glass', 'Custom': 'Своя',
        'Background': 'Фон', 'Outlines': 'Контуры', 'Text': 'Текст', 'Accent': 'Акцент', 'Any colour': 'Любой цвет', 'Text size': 'Размер текста', 'Small': 'Мелкий', 'Medium': 'Средний', 'Large': 'Крупный',
        'Corner rounding': 'Скругление углов', 'Cubic': 'Кубично', 'Round avatars': 'Круглые аватары', 'Uppercase labels': 'Подписи заглавными', 'Reduce motion': 'Меньше анимации',
        'Wallpaper': 'Обои', 'Layout density': 'Плотность', 'Cozy': 'Просторно', 'Compact': 'Компактно', 'Interface language': 'Язык интерфейса',
        'Reset appearance': 'Сбросить оформление', 'One appearance for every KONEKT product. Signed in, it follows your account.': 'Одно оформление для всех продуктов KONEKT. Войдя в аккаунт, вы забираете его с собой.',
        'Low contrast — text may be hard to read.': 'Низкий контраст — текст может плохо читаться.', 'None': 'Нет', 'Aurora': 'Аврора', 'Ember': 'Уголь', 'Mono': 'Моно', 'Teal': 'Бирюза', 'Violet': 'Фиолет', 'Void': 'Пустота', 'Nebula': 'Туманность', 'Grid': 'Сетка', 'Orbit': 'Орбита',
        'Sky': 'Небо', 'Mint': 'Мята', 'Rose': 'Роза', 'Gold': 'Золото', 'Ink': 'Чернила', 'Scheme, accent, text size and corners: the same everywhere.': 'Схема, акцент, размер текста и углы: везде одинаково.',
      },
    },
    /* panel(opts) -> HTML. opts.rows: array of row ids to include (default all); opts.langs: show the language row. Uses the family's .set-* / .seg / .sw classes; styles() gives the CSS. */
    panel: function (opts) {
      opts = opts || {};
      var s = API.get(), T = API.T, L = API.lang();
      var rows = opts.rows || ['mode', 'colours', 'accent', 'fs', 'radius', 'avRound', 'caps', 'motion', 'wall', 'density', 'lang', 'reset'];
      function seg(key, list){ return '<span class="seg" role="radiogroup">' + list.map(function (o) { return '<button class="' + (String(s[key]) === String(o[0]) ? 'on' : '') + '" data-look="' + key + '" data-val="' + o[0] + '" role="radio" aria-checked="' + (String(s[key]) === String(o[0])) + '">' + T(o[1]) + '</button>'; }).join('') + '</span>'; }
      function sw(key, inv){ var on = inv ? !s[key] : !!s[key]; return '<button class="sw' + (on ? ' on' : '') + '" data-looksw="' + key + '" data-inv="' + (inv ? 1 : 0) + '" role="switch" aria-checked="' + on + '"><i></i></button>'; }
      function row(title, desc, ctl, cls){ return '<div class="set-row' + (cls ? ' ' + cls : '') + '"><span class="set-m"><span class="set-t">' + T(title) + '</span>' + (desc ? '<span class="set-d">' + T(desc) + '</span>' : '') + '</span>' + ctl + '</div>'; }
      function col(key, label){ var v = s[key]; return row(label, '', '<span class="set-side col-side">' + (v ? '<button class="btn-xs" data-lookclear="' + key + '">×</button>' : '') + '<input type="color" class="col-in" data-lookcol="' + key + '" value="' + (v || (key === 'bgCol' ? '#000000' : key === 'lineCol' ? '#434343' : '#ffffff')) + '" aria-label="' + T(label) + '"></span>'); }
      var h = '<div class="look-panel">';
      h += '<p class="set-note">' + T('One appearance for every KONEKT product. Signed in, it follows your account.') + '</p>';
      if (rows.indexOf('mode') >= 0) h += row('Colour scheme', '', seg('mode', [['dark', 'Dark'], ['light', 'Light'], ['system', 'System'], ['glass', 'Liquid Glass'], ['custom', 'Custom']]));
      if (rows.indexOf('colours') >= 0 && s.mode === 'custom') {
        h += col('bgCol', 'Background') + col('lineCol', 'Outlines') + col('textCol', 'Text');
        var bg = s.bgCol || '#000000', tx = s.textCol || (luma(bg) > 0.5 ? '#000000' : '#ffffff');
        if (contrast(bg, tx) < 4.5) h += '<p class="set-note warn">' + T('Low contrast — text may be hard to read.') + '</p>';
      }
      if (rows.indexOf('accent') >= 0) h += row('Accent', '', '<span class="set-side col-side"><span class="swatches">' + ACCENTS.map(function (a) { return '<button class="swatch' + (s.accent === a[0] ? ' on' : '') + '" data-look="accent" data-val="' + a[0] + '" style="background:' + a[0] + '" title="' + T(a[1]) + '" aria-label="' + T(a[1]) + '"></button>'; }).join('') + '</span><input type="color" class="col-in" data-lookcol="accent" value="' + s.accent + '" aria-label="' + T('Any colour') + '"></span>');
      if (rows.indexOf('fs') >= 0) h += row('Text size', '', seg('fs', [['s', 'Small'], ['m', 'Medium'], ['l', 'Large']]));
      if (rows.indexOf('radius') >= 0) h += row('Corner rounding', '', '<span class="set-side"><input type="range" class="rng" data-lookrange="radius" min="0" max="24" step="2" value="' + s.radius + '" aria-label="' + T('Corner rounding') + '"><b class="rng-v">' + (s.radius ? s.radius + 'px' : T('Cubic')) + '</b></span>');
      if (rows.indexOf('avRound') >= 0) h += row('Round avatars', '', sw('avRound'));
      if (rows.indexOf('caps') >= 0) h += row('Uppercase labels', '', sw('caps'));
      if (rows.indexOf('motion') >= 0) h += row('Reduce motion', '', sw('motion', true));
      if (rows.indexOf('wall') >= 0) h += row('Wallpaper', '', '<span class="set-side walls">' + Object.keys(WALLS).map(function (w) { return '<button class="wall' + (s.wall === w ? ' on' : '') + '" data-look="wall" data-val="' + w + '" style="background:' + (WALLS[w] || 'var(--bg)') + '" title="' + T(WALL_NAMES[w]) + '" aria-label="' + T(WALL_NAMES[w]) + '"></button>'; }).join('') + '</span>');
      if (rows.indexOf('density') >= 0) h += row('Layout density', '', seg('density', [['cozy', 'Cozy'], ['compact', 'Compact']]));
      if (rows.indexOf('lang') >= 0 && opts.langs !== false) h += row('Interface language', '', '<span class="seg" role="radiogroup"><button class="' + (L === 'en' ? 'on' : '') + '" data-look="lang" data-val="en">EN</button><button class="' + (L === 'ru' ? 'on' : '') + '" data-look="lang" data-val="ru">RU</button></span>');
      if (rows.indexOf('reset') >= 0) h += '<div class="set-row"><button class="btn-xs danger" data-lookreset="1">' + T('Reset appearance') + '</button></div>';
      return h + '</div>';
    },
    /* wire(rootEl, onChange) — delegated handlers for the panel. onChange(look) is called after every change (re-render the panel there). */
    wire: function (el, onChange) {
      if (!el || el.__lookWired) return; el.__lookWired = true;
      var done = function () { if (onChange) onChange(API.get()); };
      el.addEventListener('click', function (e) {
        var b = e.target.closest && e.target.closest('[data-look],[data-looksw],[data-lookclear],[data-lookreset]');
        if (!b) return;
        if (b.dataset.look) { var o1 = {}; o1[b.dataset.look] = b.dataset.look === 'radius' ? Number(b.dataset.val) : b.dataset.val; API.set(o1); done(); }
        else if (b.dataset.looksw) { var k = b.dataset.looksw; var o = {}; o[k] = !API.get()[k]; API.set(o); done(); }
        else if (b.dataset.lookclear) { var o2 = {}; o2[b.dataset.lookclear] = ''; API.set(o2); done(); }
        else if (b.dataset.lookreset) { API.reset(); done(); }
      });
      el.addEventListener('input', function (e) {
        var t = e.target;
        if (t.dataset && t.dataset.lookcol) { var o = {}; o[t.dataset.lookcol] = t.value; API.set(o); }

<style>
/* ============================= THEME =============================

:root{
  --bg:#000000;
  --hover:#0d0d0d;
  --hover-2:#141414;
  --line:#434343;      /* soft rule  — chrome, unfocused windows */
  --line-2:#666666;    /* hard rule  — focused edges, fields     */
  --line-3:#232323;    /* hairline   — inside panels             */
  --text:#ffffff;
  --text-2:#d8d8d8;
  --btn-h:#d6d6d6;
  --dim:#999999;
  --dim-2:#6f6f6f;
  --accent:#1d9bf0;
  --like:#f91880;
  --repost:#00ba7c;
  --warn:#ffd400;
  --danger:#f4212e;
  --font:'Montserrat','Segoe UI',Arial,Helvetica,sans-serif;
  --mono:'Cascadia Mono','Consolas',ui-monospace,'Menlo',monospace;
  --strip:34px;        /* window titlebar */
  --bar:44px;          /* taskbar */
  --radius:0px;        /* cubic by default; Settings can soften it, 0–24px */
  --av-radius:0px;     /* avatars follow --radius unless "round avatar" is on */
  --fs:14px;           /* base type size — Settings: text size S/M/L */
  --glass-blur:26px;
  --glass-bg:rgba(20,20,26,.55);
  --glass-brd:rgba(255,255,255,.10);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#ffffff;
  --hover:#f3f3f3;
  --hover-2:#e8e8e8;
  --line:#c4c4c4;
  --line-2:#8c8c8c;
  --line-3:#e2e2e2;
  --text:#000000;
  --text-2:#333333;
  --btn-h:#2b2b2b;
  --dim:#5c5c5c;
  --dim-2:#8a8a8a;
  --glass-bg:rgba(250,250,252,.6);
  --glass-brd:rgba(0,0,0,.08);
  color-scheme:light;
}
/* ---- the family's KONEKT LOOK attributes (the module writes them; this sheet reads them) ---- */
:root[data-fs="s"]{--fs:13px}
:root[data-fs="l"]{--fs:15.5px}
:root[data-density="compact"]{--strip:28px;--bar:38px}
:root[data-density="compact"] .sm-i{padding:7px 16px}
:root[data-density="compact"] .st-ni{padding:8px 18px}
:root[data-density="compact"] .st-main{padding:16px 20px}
:root[data-density="compact"] .fx-grid{padding:6px;gap:1px}
:root[data-density="compact"] .fi{padding:8px 6px 6px}
:root[data-density="compact"] .nx-it{padding:6px 14px}
:root[data-density="compact"] .q>button,:root[data-density="compact"] .kb-dial{padding:12px 14px}
:root[data-caps="off"] .win-t,:root[data-caps="off"] .task .t,:root[data-caps="off"] .sm-i span,
:root[data-caps="off"] .sm-n,:root[data-caps="off"] .sm-p span,:root[data-caps="off"] .dico .t,

:root[data-caps="off"] .kb-dial .t,:root[data-caps="off"] .kb-sd h3,:root[data-caps="off"] #trUp span,
:root[data-caps="off"] #trClock .d,:root[data-caps="off"] .lock-in::placeholder{text-transform:none}

html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:var(--fs);font-weight:400;line-height:1.4;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:0;text-align:left;padding:0}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;border-radius:0;padding:0}
a{color:var(--accent);text-decoration:none}
svg{display:block}
::selection{background:var(--text);color:var(--bg)}
.scroll::-webkit-scrollbar{width:6px;height:6px}
.scroll::-webkit-scrollbar-thumb{background:#2e2e2e}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll{scrollbar-width:thin;scrollbar-color:#2e2e2e transparent}
:root[data-theme="light"] .scroll::-webkit-scrollbar-thumb{background:#c9c9c9}
:root[data-theme="light"] .scroll{scrollbar-color:#c9c9c9 transparent}
body.dragging,body.dragging *{user-select:none !important;cursor:inherit}

/* ============================= PHASES ============================= */
#boot,#lock,#shut,#os{display:none}
body[data-phase="boot"] #boot{display:flex}
body[data-phase="lock"] #lock{display:flex}
body[data-phase="shut"] #shut{display:flex}
body[data-phase="os"]   #os{display:flex}

/* wordmark */
.lg{display:inline-flex;align-items:center;gap:.14em;font-weight:800;letter-spacing:.02em;line-height:1;color:var(--text)}
.lg .gl{flex:none}

/* ============================= BOOT ============================= */
#boot{
  position:fixed;inset:0;background:#000;color:#fff;z-index:400;
  flex-direction:column;align-items:center;justify-content:center;gap:26px;cursor:pointer;
}
#bootBar{width:220px;height:2px;background:#232323}
#bootFill{width:0%;height:100%;background:#fff;transition:width .25s linear}
#bootLog{
  width:min(560px,84vw);height:170px;overflow:hidden;
  font-family:var(--mono);font-size:11px;line-height:1.7;color:#6f6f6f;
}
#bootLog .ok{color:#999}
#bootLog .tag{color:#00ba7c}
#bootLog .tagw{color:#ffd400}
#bootHint{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#434343}

/* ============================= LOCK / LOGIN ============================= */
#lock{
  position:fixed;inset:0;background:var(--bg);z-index:300;
  flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
#lkH{font-size:64px;font-weight:700;letter-spacing:.02em;line-height:1}
#lkD{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:34px}
.lock-tile{display:flex;flex-direction:column;align-items:center;gap:14px}
.lock-av{
  width:64px;height:64px;background:var(--text);color:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;border-radius:var(--av-radius);
}
.lock-name{font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.lock-in{
  width:260px;border:1px solid var(--line-2);padding:10px 12px;
  font-size:14px;text-align:center;letter-spacing:.03em;border-radius:var(--radius);
}
.lock-in::placeholder{color:var(--dim-2);text-transform:uppercase;font-size:11px;letter-spacing:.12em}
.btn-solid{
  background:var(--text);color:var(--bg);font-weight:700;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;padding:11px 26px;text-align:center;
  border-radius:var(--radius);
}
.btn-solid:hover{background:var(--btn-h)}
.lock-sso{
  margin-top:12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim-2);
  border:1px solid var(--line-3);padding:9px 16px;border-radius:var(--radius);
}
.lock-sso:hover{color:var(--text);border-color:var(--line)}
.lock-err{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--danger);min-height:13px}
.lock-hint{margin-top:26px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim-2)}
.lock-reset{margin-top:8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim-2)}
.lock-reset:hover{color:var(--danger)}
#lockPower{position:fixed;right:22px;bottom:18px;display:flex;gap:6px}
#lockPower button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
#lockPower button:hover{color:var(--text);background:var(--hover-2)}

/* ============================= SHUTDOWN ============================= */
#shut{
  position:fixed;inset:0;background:#000;z-index:500;cursor:pointer;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
#shut .s1{color:#6f6f6f;font-size:13px;letter-spacing:.06em}
#shut .s2{color:#434343;font-size:10px;letter-spacing:.16em;text-transform:uppercase}

/* ============================= DESKTOP ============================= */
#os{position:fixed;inset:0;flex-direction:column}
#desk{position:relative;flex:1;overflow:hidden;background-color:var(--bg);background-size:cover;background-position:center}
#icons{
  position:absolute;left:10px;top:10px;bottom:10px;
  display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:2px;
}
.dico{
  width:86px;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:7px;
  border:1px solid transparent;cursor:default;border-radius:var(--radius);
}
.dico svg{width:30px;height:30px;color:var(--text)}
.dico .t{
  font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:center;
  color:var(--text);text-shadow:0 1px 4px rgba(0,0,0,.9);
  max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
:root[data-theme="light"] .dico .t{text-shadow:0 1px 4px rgba(255,255,255,.9)}
.dico:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14)}
.dico.sel{background:rgba(255,255,255,.09);border-color:var(--line-2)}
:root[data-theme="light"] .dico:hover{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.16)}
:root[data-theme="light"] .dico.sel{background:rgba(0,0,0,.08);border-color:var(--line-2)}

/* ============================= TASKBAR ============================= */
#taskbar{
  height:var(--bar);flex:none;display:flex;align-items:stretch;
  background:var(--bg);border-top:1px solid var(--line);position:relative;z-index:200;
}
#stBtn{width:54px;display:flex;align-items:center;justify-content:center;color:var(--text)}
#stBtn:hover,#stBtn.on{background:var(--hover-2)}
#tasks{flex:1;display:flex;align-items:stretch;overflow:hidden}
.task{
  display:flex;align-items:center;gap:8px;padding:0 14px;max-width:190px;min-width:0;
  color:var(--dim);border-right:1px solid var(--line-3);
}
.task svg{width:15px;height:15px;flex:none}
.task .t{
  font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.task:hover{background:var(--hover);color:var(--text-2)}
.task.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--text)}
.task.minz{color:var(--dim-2)}
#tray{display:flex;align-items:center;gap:16px;padding:0 16px;border-left:1px solid var(--line-3)}
#trUp{display:flex;align-items:center;gap:7px}
#trUp i{width:6px;height:6px;background:var(--repost);display:block}
#trUp.off i{background:var(--danger)}
#trUp span{font-size:9px;letter-spacing:.14em;color:var(--dim-2);text-transform:uppercase}
#trClock{text-align:right;line-height:1.25}
#trClock .h{font-size:12px;font-weight:600;letter-spacing:.04em}
#trClock .d{font-size:9px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}

/* ============================= START MENU ============================= */
#smenu{
  position:absolute;left:8px;bottom:calc(var(--bar) + 8px);width:300px;z-index:250;
  background:var(--bg);border:1px solid var(--line-2);display:none;flex-direction:column;
  box-shadow:0 18px 50px rgba(0,0,0,.55);border-radius:var(--radius);
}
#smenu.on{display:flex}
.sm-head{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line-3)}
.sm-av{
  width:38px;height:38px;background:var(--text);color:var(--bg);flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;
  border-radius:var(--av-radius);
}
.sm-n{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sm-d{font-size:10px;color:var(--dim);letter-spacing:.06em}
.sm-list{padding:6px 0}
.sm-i{
  width:100%;display:flex;align-items:center;gap:12px;padding:10px 16px;color:var(--text);
}
.sm-i svg{width:17px;height:17px;color:var(--dim)}
.sm-i span{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.sm-i:hover{background:var(--hover)}
.sm-i:hover svg{color:var(--text)}
.sm-sso{border-top:1px solid var(--line-3);border-bottom:1px solid var(--line-3);padding:4px 0}
.sm-foot{display:flex;border-top:1px solid var(--line-3)}
.sm-p{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 0;color:var(--dim);
}
.sm-p svg{width:16px;height:16px}
.sm-p span{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase}
.sm-p:hover{background:var(--hover);color:var(--text)}

/* ============================= CONTEXT MENU ============================= */
#cmenu{
  position:fixed;z-index:260;background:var(--bg);border:1px solid var(--line-2);
  min-width:190px;display:none;flex-direction:column;padding:4px 0;
  box-shadow:0 14px 40px rgba(0,0,0,.5);border-radius:var(--radius);
}
#cmenu.on{display:flex}
#cmenu button{
  padding:9px 16px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  display:flex;align-items:center;gap:10px;
}
#cmenu button svg{width:14px;height:14px;color:var(--dim)}
#cmenu button:hover{background:var(--hover)}
#cmenu button:hover svg{color:var(--text)}
#cmenu .sep{height:1px;background:var(--line-3);margin:4px 0}

/* ============================= WINDOWS ============================= */
#winlayer{position:absolute;inset:0;pointer-events:none}
.win{
  position:absolute;display:flex;flex-direction:column;pointer-events:auto;
  background:var(--bg);border:1px solid var(--line);
  box-shadow:0 18px 50px rgba(0,0,0,.55);border-radius:var(--radius);overflow:hidden;
  min-width:200px;min-height:120px;
}
.win.focus{border-color:var(--line-2)}
.win.minz{display:none}
.win.maxed{box-shadow:none}
.win-tb{
  height:var(--strip);flex:none;display:flex;align-items:center;
  border-bottom:1px solid var(--line-3);touch-action:none;
}
.win-ic{width:34px;display:flex;align-items:center;justify-content:center;color:var(--dim);flex:none}
.win-ic svg{width:15px;height:15px}
.win-t{
  flex:1;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.win.focus .win-t{color:var(--text)}
.win.focus .win-ic{color:var(--text)}
.wb{
  width:38px;height:var(--strip);display:flex;align-items:center;justify-content:center;
  color:var(--dim);flex:none;
}
.wb:hover{background:var(--hover-2);color:var(--text)}
.wb.cls:hover{background:var(--danger);color:#fff}
.wb svg{width:11px;height:11px}
.win-body{flex:1;min-height:0;display:flex;position:relative}
.win.dragged iframe{pointer-events:none}
/* resize handles */
.rs{position:absolute;z-index:5}
.rs.n{top:-3px;left:8px;right:8px;height:6px;cursor:n-resize}
.rs.s{bottom:-3px;left:8px;right:8px;height:6px;cursor:s-resize}
.rs.e{right:-3px;top:8px;bottom:8px;width:6px;cursor:e-resize}
.rs.w{left:-3px;top:8px;bottom:8px;width:6px;cursor:w-resize}
.rs.ne{top:-3px;right:-3px;width:11px;height:11px;cursor:ne-resize}
.rs.nw{top:-3px;left:-3px;width:11px;height:11px;cursor:nw-resize}
.rs.se{bottom:-3px;right:-3px;width:11px;height:11px;cursor:se-resize}
.rs.sw{bottom:-3px;left:-3px;width:11px;height:11px;cursor:sw-resize}
.win.maxed .rs{display:none}
#snapghost{
  position:absolute;z-index:150;pointer-events:none;display:none;
  border:1px solid var(--text);background:rgba(255,255,255,.06);
  transition:left .08s,top .08s,width .08s,height .08s;
}
:root[data-theme="light"] #snapghost{background:rgba(0,0,0,.06)}

/* ============================= APP: TERMINAL ============================= */
.term{
  flex:1;display:flex;flex-direction:column;font-family:var(--mono);font-size:12.5px;
  line-height:1.55;padding:10px 12px;overflow-y:auto;cursor:text;
}
.term .tl{white-space:pre-wrap;word-break:break-word;color:var(--text-2)}
.term .tl.dim{color:var(--dim)}
.term .tl.err{color:var(--danger)}
.term .tl .acc{color:var(--accent)}
.term .tl .grn{color:var(--repost)}
.term-row{display:flex;align-items:baseline}
.term-ps{color:var(--repost);white-space:pre;flex:none}
.term-in{flex:1;font-family:var(--mono);font-size:12.5px;caret-color:var(--text);min-width:40px}

/* ============================= APP: FILES ============================= */
.fx{flex:1;display:flex;flex-direction:column;min-width:0}
.fx-bar{
  height:38px;flex:none;display:flex;align-items:center;gap:2px;padding:0 6px;
  border-bottom:1px solid var(--line-3);
}
.fx-b{
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--dim);
}
.fx-b:hover{background:var(--hover-2);color:var(--text)}
.fx-b:disabled{color:var(--line);cursor:default;background:none}
.fx-b svg{width:14px;height:14px}
.fx-path{
  flex:1;display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden;
  padding:0 8px;font-size:11px;letter-spacing:.04em;
}
.fx-crumb{color:var(--dim);padding:4px 5px;font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.08em;white-space:nowrap}
.fx-crumb:hover{color:var(--text);background:var(--hover-2)}
.fx-crumb.cur{color:var(--text)}
.fx-sl{color:var(--dim-2);font-size:10px}
.fx-grid{
  flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));
  gap:2px;padding:10px;align-content:start;
}
.fi{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 9px;
  border:1px solid transparent;cursor:default;border-radius:var(--radius);
}
.fi svg{width:28px;height:28px;color:var(--dim)}
.fi.dir svg{color:var(--text)}
.fi .t{
  font-size:10.5px;text-align:center;max-width:100%;overflow-wrap:anywhere;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.fi:hover{background:var(--hover);border-color:var(--line-3)}
.fi.sel{background:var(--hover-2);border-color:var(--line-2)}
.fi .ren{width:100%;border:1px solid var(--line-2);background:var(--bg);font-size:10.5px;text-align:center;padding:2px 3px}
.fx-status{
  height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;
  border-top:1px solid var(--line-3);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim-2);
}

/* ============================= APP: NOTES ============================= */
.nx{flex:1;display:flex;min-width:0}
.nx-side{width:190px;flex:none;border-right:1px solid var(--line-3);display:flex;flex-direction:column}
.nx-head{
  height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 8px 0 14px;border-bottom:1px solid var(--line-3);
  font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
}
.nx-new{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.nx-new:hover{background:var(--hover-2);color:var(--text)}
.nx-new svg{width:13px;height:13px}
.nx-list{flex:1;overflow-y:auto;padding:4px 0}
.nx-it{width:100%;padding:9px 14px;display:block}
.nx-it .n{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx-it .p{font-size:9.5px;color:var(--dim-2);letter-spacing:.04em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx-it:hover{background:var(--hover)}
.nx-it.on{background:var(--hover-2);box-shadow:inset 2px 0 0 var(--text)}
.nx-main{flex:1;display:flex;flex-direction:column;min-width:0}
.nx-ta{flex:1;resize:none;padding:16px;font-size:13.5px;line-height:1.6;font-family:var(--mono)}
.nx-status{
  height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;
  border-top:1px solid var(--line-3);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim-2);
}
.nx-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim-2);font-size:11px;letter-spacing:.12em;text-transform:uppercase}

/* ============================= APP: KALC ============================= */
.kc{flex:1;display:flex;flex-direction:column}
.kc-out{
  flex:none;padding:22px 16px 10px;text-align:right;
  font-size:15px;color:var(--dim);min-height:24px;letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);
}
.kc-cur{
  flex:none;padding:0 16px 18px;text-align:right;font-size:30px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);
}
.kc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-3);border-top:1px solid var(--line-3)}
.kc-b{background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500}
.kc-b:hover{background:var(--hover-2)}
.kc-b.op{color:var(--dim)}
.kc-b.op:hover{color:var(--text)}
.kc-b.eq{background:var(--text);color:var(--bg);font-weight:700}
.kc-b.eq:hover{background:var(--btn-h)}

/* ============================= APP: SETTINGS ============================= */
.st{flex:1;display:flex;min-width:0}
.st-nav{width:172px;flex:none;border-right:1px solid var(--line-3);padding:8px 0;overflow-y:auto}
.st-ni{
  width:100%;padding:11px 18px;font-size:10.5px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);display:block;
}
.st-ni:hover{background:var(--hover);color:var(--text-2)}
.st-ni.on{color:var(--text);box-shadow:inset 2px 0 0 var(--text)}
.st-main{flex:1;overflow-y:auto;padding:22px 26px;min-width:0}
.st-sec{margin-bottom:30px}
.st-t{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden}
.seg button{
  padding:8px 16px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
}
.seg button + button{border-left:1px solid var(--line-2)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--text);color:var(--bg)}
.swatches{display:flex;gap:8px}
.swatch{width:24px;height:24px;border:1px solid var(--line);cursor:pointer;border-radius:var(--radius)}
.swatch:hover{border-color:var(--dim)}
.swatch.on{outline:2px solid var(--text);outline-offset:2px}
.walls{display:flex;flex-wrap:wrap;gap:10px}
.wall{
  width:128px;height:72px;border:1px solid var(--line);background-size:cover;background-position:center;
  cursor:pointer;position:relative;border-radius:var(--radius);
}
.wall:hover{border-color:var(--dim)}
.wall.on{border-color:var(--text);outline:1px solid var(--text)}
.wall span{
  position:absolute;left:6px;bottom:4px;font-size:8.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);
}
.st-field{display:flex;gap:8px;align-items:center}
.st-in{border:1px solid var(--line-2);padding:9px 12px;font-size:13px;width:220px;border-radius:var(--radius)}
.btn-line{
  border:1px solid var(--line-2);padding:9px 18px;font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;border-radius:var(--radius);
}
.btn-line:hover{background:var(--hover-2)}
.btn-line.danger{color:var(--danger);border-color:var(--danger)}
.btn-line.danger:hover{background:var(--danger);color:#fff}
.about-row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid var(--line-3);font-size:12.5px}
.about-row .k{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding-top:2px}
.about-row .v{text-align:right;overflow-wrap:anywhere}
.st-note{font-size:11px;color:var(--dim);line-height:1.6;margin-top:10px}
/* custom-scheme colour rows, the rounding slider and the toggle rows */
.col-row,.rng-row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:9px 0;border-bottom:1px solid var(--line-3);
}
.col-l{font-size:12.5px}
.col-r{display:flex;align-items:center;gap:10px}
.col-r b{font-family:var(--mono);font-size:10.5px;color:var(--dim);font-weight:400;min-width:62px;text-align:right}
input[type="color"]{
  width:30px;height:24px;padding:0;border:1px solid var(--line-2);background:none;cursor:pointer;
  border-radius:var(--radius);
}
input[type="color"]::-webkit-color-swatch-wrapper{padding:2px}
input[type="color"]::-webkit-color-swatch{border:0;border-radius:0}
input[type="range"]{
  -webkit-appearance:none;appearance:none;width:150px;height:1px;background:var(--line-2);cursor:pointer;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:13px;height:13px;background:var(--text);border-radius:var(--radius);
}
input[type="range"]::-moz-range-thumb{width:13px;height:13px;background:var(--text);border:0;border-radius:var(--radius)}
.tog-row{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px 0;border-bottom:1px solid var(--line-3);font-size:12.5px;
}
.tog-row:hover{color:var(--text)}
.tog-v{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim-2)}
.tog-v.on{color:var(--text)}
.sw-wheel{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;
  background:conic-gradient(#f4212e,#ffd400,#00ba7c,#1d9bf0,#a970ff,#f91880,#f4212e)}
.sw-wheel input[type="color"]{opacity:0;width:100%;height:100%;border:0;cursor:pointer}

/* ============================= APP: KONEKT BROWSER ============================= */
.kb{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.kb-tabs{height:30px;flex:none;display:flex;align-items:stretch;border-bottom:1px solid var(--line-3);overflow:hidden}
.kb-tab{
  display:flex;align-items:center;gap:8px;padding:0 10px;max-width:190px;min-width:74px;
  border-right:1px solid var(--line-3);color:var(--dim);font-size:10.5px;letter-spacing:.04em;
}
.kb-tab .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.kb-tab .x{font-family:var(--mono);font-size:11px;color:var(--dim-2);flex:none}
.kb-tab .x:hover{color:var(--danger)}
.kb-tab:hover{background:var(--hover)}
.kb-tab.on{color:var(--text);background:var(--hover-2);box-shadow:inset 0 -2px 0 var(--accent)}
.kb-newtab{width:30px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.kb-newtab:hover{background:var(--hover-2);color:var(--text)}
.kb-newtab svg{width:12px;height:12px}
.kb-bar{height:36px;flex:none;display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--line-3)}
.kb-b{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--dim);flex:none;border-radius:var(--radius)}
.kb-b:hover{background:var(--hover-2);color:var(--text)}
.kb-b:disabled{color:var(--line);cursor:default;background:none}
.kb-b svg{width:13px;height:13px}
.kb-omni{
  flex:1;display:flex;align-items:center;gap:8px;min-width:0;height:26px;padding:0 10px;
  border:1px solid var(--line-2);margin:0 6px;border-radius:var(--radius);
}
.kb-omni:focus-within{border-color:var(--accent)}
.kb-omni .lock{font-size:9px;letter-spacing:.1em;color:var(--repost);flex:none}
.kb-omni .lock.no{color:var(--warn)}
.kb-omni input{flex:1;min-width:0;font-size:11.5px;letter-spacing:.02em}
.kb-view{flex:1;min-height:0;position:relative;display:flex;background:var(--bg)}
.kb-view iframe{flex:1;border:0;width:100%;height:100%;background:#fff}
.kb-sd{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:38px 24px}
.kb-sd .mk{margin-bottom:10px}
.kb-sd .cl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim-2);margin-bottom:26px}
.kb-sd h3{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim-2);margin:0 0 12px;align-self:flex-start}
.kb-dials{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;width:100%;max-width:540px}
.kb-dial{
  border:1px solid var(--line-3);padding:16px 12px;display:flex;flex-direction:column;gap:8px;
  align-items:center;text-align:center;border-radius:var(--radius);color:var(--text);
}
.kb-dial:hover{background:var(--hover);border-color:var(--line-2)}
.kb-dial .fav{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.kb-dial .t{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.kb-dial .h{font-size:9px;color:var(--dim-2);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kb-page{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:30px;text-align:center;background:var(--bg);
}
.kb-page .t{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.kb-page .d{font-size:12px;color:var(--dim);line-height:1.7;max-width:420px}
.kb-note{
  height:24px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;
  border-top:1px solid var(--line-3);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim-2);
}
.kb-note a{color:var(--dim)}
.kb-note a:hover{color:var(--text)}

/* ============================= DESKTOP 1.6: SPACES, TRAY PANELS, SEARCH, SWITCHER ============================= */
:root{--screen-filter:none}
#os,#cmenu,#ktoast,#kmodal,#search,#alttab,#ntoasts{filter:var(--screen-filter)}

/* workspaces */
#spaces{display:flex;align-items:center;gap:3px;padding-right:10px;margin-right:4px;border-right:1px solid var(--line-3)}
.sp-pip{
  position:relative;min-width:22px;height:16px;padding:0 4px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:8.5px;font-weight:700;letter-spacing:.06em;color:var(--dim-2);
}
.sp-pip:hover{border-color:var(--line-2);color:var(--text)}
.sp-pip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.sp-pip.has::after{content:"";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:3px;height:3px;background:var(--accent)}
.sp-pip.on.has::after{background:var(--text)}
.win.offspace{display:none !important}

/* tray buttons */
.tr-b{
  position:relative;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  color:var(--dim);border-radius:var(--radius);
}
.tr-b:hover,.tr-b.on{background:var(--hover-2);color:var(--text)}
.tr-b svg{width:15px;height:15px}
.tr-badge{
  position:absolute;top:1px;right:1px;min-width:13px;height:13px;padding:0 3px;
  background:var(--accent);color:#fff;font-size:8px;font-weight:700;
  display:none;align-items:center;justify-content:center;border-radius:7px;
}
.tr-badge.on{display:flex}

/* shared drop-panel for the tray */
.tpanel{
  position:absolute;right:8px;bottom:calc(var(--bar) + 8px);width:min(320px,calc(100vw - 16px));z-index:250;
  background:var(--bg);border:1px solid var(--line-2);display:none;flex-direction:column;
  box-shadow:0 18px 50px rgba(0,0,0,.55);border-radius:var(--radius);max-height:min(72vh,560px);
}
.tpanel.on{display:flex}
:root[data-appearance="glass"] .tpanel{
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.7);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.7);
  border-color:var(--glass-brd);
}
.tp-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--line-3);
  font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
}
.tp-head button{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim-2)}
.tp-head button:hover{color:var(--text)}
.tp-body{overflow-y:auto;padding:6px 0}

/* quick settings */
.qs-sec{padding:12px 16px;border-bottom:1px solid var(--line-3)}
.qs-sec:last-child{border-bottom:0}
.qs-l{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim-2);margin-bottom:9px}
.qs-tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qs-tile{
  display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line-3);
  color:var(--dim);border-radius:var(--radius);font-size:10.5px;font-weight:600;letter-spacing:.06em;
}
.qs-tile svg{width:14px;height:14px;flex:none}
.qs-tile:hover{border-color:var(--line-2);color:var(--text)}
.qs-tile.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.qs-slider{display:flex;align-items:center;gap:11px;padding:5px 0}
.qs-slider svg{width:14px;height:14px;color:var(--dim);flex:none}
.qs-slider input[type=range]{flex:1;width:auto}
.qs-slider b{font-family:var(--mono);font-size:10px;color:var(--dim);font-weight:400;min-width:34px;text-align:right}
.qs-scheme{display:flex;gap:4px}
.qs-scheme button{
  flex:1;padding:8px 0;text-align:center;border:1px solid var(--line-3);color:var(--dim);
  font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:var(--radius);
}
.qs-scheme button:hover{color:var(--text);border-color:var(--line-2)}
.qs-scheme button.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.qs-acc{display:flex;gap:6px;flex-wrap:wrap}
.qs-acc button{width:20px;height:20px;border:1px solid var(--line-3);border-radius:var(--radius)}
.qs-acc button.on{outline:2px solid var(--text);outline-offset:2px}
.qs-foot{display:flex;gap:6px;padding:12px 16px;border-top:1px solid var(--line-3)}
.qs-foot button{
  flex:1;padding:9px 0;text-align:center;border:1px solid var(--line-2);color:var(--text);
  font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:var(--radius);
}
.qs-foot button:hover{background:var(--hover-2)}

/* tray battery */
#trBat{display:flex;align-items:center;gap:7px}
#trBat i{display:block;height:7px;background:var(--text);outline:1px solid var(--line-2);outline-offset:2px}
#trBat b{font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--dim)}

/* quick settings: network */
.qs-net-row{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:600;padding:2px 0 8px}

function svgURI(w, h, inner){

/* Wallpapers are generated, never fetched. 960x540 like the NKO reference canvas. */

/* ---------------------------- virtual filesystem ----------------------------
   A tree in localStorage. dir: {type,children,mtime}  file: {type,content,mtime}.
   The home stays /home/user whatever the display name is. */
let FS = null;
const HOME = ['home', 'user'];
function fsNow(){ return Date.now(); }
function fdir(children){ return { type:'dir', children: children || {}, mtime: fsNow() }; }
function ffile(content){ return { type:'file', content: content || '', mtime: fsNow() }; }

function seedFS(){

        }),

      'lastochka': ffile('LASTOCHKA neural core: uplink not provisioned on this build.\nThe full assistant lives in the KONEKT app.')
    })

function fsSave(){ store.set('kos.fs', FS); }
function fsLoad(){
  FS = store.get('kos.fs', null);
  if(!FS || FS.type !== 'dir'){ FS = seedFS(); fsSave(); }
}
/* path helpers: parts are arrays; [] is the root */
function fsResolve(path, cwd){
  let parts = path.startsWith('/') ? [] : (cwd || []).slice();
  if(path.startsWith('~')) { parts = HOME.slice(); path = path.slice(1); }
  for(const seg of path.split('/')){
    if(!seg || seg === '.') continue;
    if(seg === '..') parts.pop();
    else parts.push(seg);
  }
  return parts;
}
function fsGet(parts){
  let node = FS;
  for(const p of parts){
    if(!node || node.type !== 'dir' || !node.children[p]) return null;
    node = node.children[p];
  }
  return node;
}
function fsPathStr(parts){ return '/' + parts.join('/'); }
function fsTilde(parts){
  const s = fsPathStr(parts);
  const h = fsPathStr(HOME);
  return s === h ? '~' : s.startsWith(h + '/') ? '~' + s.slice(h.length) : s;
}
function fsMk(parts, node){
  if(!parts.length) return 'cannot create /';
  const parent = fsGet(parts.slice(0, -1));
  if(!parent || parent.type !== 'dir') return 'no such directory: ' + fsPathStr(parts.slice(0, -1));
  const name = parts[parts.length - 1];
  if(parent.children[name]) return 'already exists: ' + name;
  parent.children[name] = node;
  parent.mtime = fsNow();
  fsSave();
  return null;
}
function fsWrite(parts, content, append){
  const parent = fsGet(parts.slice(0, -1));
  if(!parent || parent.type !== 'dir') return 'no such directory';
  const name = parts[parts.length - 1];
  const cur = parent.children[name];
  if(cur && cur.type === 'dir') return 'is a directory: ' + name;
  if(cur){ cur.content = append ? cur.content + content : content; cur.mtime = fsNow(); }
  else parent.children[name] = ffile(content);
  fsSave();
  return null;
}
function fsRm(parts, recursive){
  if(!parts.length) return 'refusing to remove /';
  const parent = fsGet(parts.slice(0, -1));
  const name = parts[parts.length - 1];
  if(!parent || !parent.children[name]) return 'no such file: ' + name;
  const node = parent.children[name];
  if(node.type === 'dir' && Object.keys(node.children).length && !recursive) return 'directory not empty (use rm -r): ' + name;
  delete parent.children[name];
  parent.mtime = fsNow();
  fsSave();
  return null;
}
function fsRename(parts, newName){
  const parent = fsGet(parts.slice(0, -1));
  const name = parts[parts.length - 1];
  if(!parent || !parent.children[name]) return 'no such file';
  if(!newName || /[\/]/.test(newName)) return 'bad name';
  if(parent.children[newName]) return 'already exists: ' + newName;
  parent.children[newName] = parent.children[name];
  delete parent.children[name];
  parent.mtime = fsNow();
  fsSave();
  return null;
}
function fsSizeOf(node){
  if(node.type === 'file') return node.content.length;
  return Object.values(node.children).reduce((a, c) => a + fsSizeOf(c), 0);
}

/* ============================================================================
   KONEKT SSO - one identity for the whole family.

   A real OpenID Connect authorization-code flow with PKCE (S256). The client
   `konekt-os` is registered at konekt-sso.vercel.app for http://localhost:8923/,
   which is exactly where the kiosk serves this shell - so the redirect comes
   home. The OS never sees a password; the token is exchanged from this page
   (a public client, CORS-allowed) and kept on the device.
   ========================================================================= */
const SSO = {
  issuer: 'https://konekt-sso.vercel.app',
  clientId: 'konekt-os',
  redirect: 'http://localhost:8923/'
};
let ME = store.get('kos.me', null);          /* the signed-in KONEKT profile */

function b64url(bytes){
  let s2 = '';
  new Uint8Array(bytes).forEach(b => s2 += String.fromCharCode(b));
  return btoa(s2).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function randomStr(n){
  const a = new Uint8Array(n || 32);
  crypto.getRandomValues(a);
  return b64url(a);
}
function ssoAvailable(){
  /* the redirect only comes home when this page IS the registered origin */
  return location.origin + location.pathname.replace(/index\.html$/, '') === SSO.redirect
      || location.origin === 'http://localhost:8923';
}
/* A local password, hashed on the device. This locks the session, not the
   disk - said plainly in Settings rather than implied. */
function pwHash(pass, salt){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + '|' + pass))
    .then(h => b64url(h));
}
function pwSet(pass){
  if(!pass){ store.del('kos.pw'); return Promise.resolve(null); }
  const salt = randomStr(12);
  return pwHash(pass, salt).then(h => { store.set('kos.pw', { salt, h }); return h; });
}
function pwCheck(pass){
  const rec = store.get('kos.pw', null);
  if(!rec) return Promise.resolve(true);
  return pwHash(pass, rec.salt).then(h => h === rec.h);
}
function pwIsSet(){ return !!store.get('kos.pw', null); }

function ssoLogin(){
  if(!ssoAvailable()){
    toast(TT('ssoOnlyOnOS'), 4200);
    return;
  }
  const verifier = randomStr(48), state = randomStr(16), nonce = randomStr(16);
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)).then(h => {
    store.set('kos.sso.v', verifier);
    store.set('kos.sso.s', state);
    const u = new URL(SSO.issuer + '/authorize');
    u.searchParams.set('client_id', SSO.clientId);
    u.searchParams.set('redirect_uri', SSO.redirect);
    u.searchParams.set('response_type', 'code');
    u.searchParams.set('scope', 'openid profile');
    u.searchParams.set('state', state);
    u.searchParams.set('nonce', nonce);
    u.searchParams.set('code_challenge', b64url(h));
    u.searchParams.set('code_challenge_method', 'S256');
    location.href = u.toString();
  });
}
function ssoFinish(){
  /* called at boot: did KONEKT SSO just send us home with a code? */
  const q = new URLSearchParams(location.search);
  const code = q.get('code'), state = q.get('state');
  if(!code) return Promise.resolve(null);
  const want = store.get('kos.sso.s', null), verifier = store.get('kos.sso.v', null);
  history.replaceState({}, '', location.pathname);      /* never leave a code in the URL */
  store.del('kos.sso.s'); store.del('kos.sso.v');
  if(!state || state !== want || !verifier){
    notify({ title: TT('ssoFailed'), body: 'state mismatch', icon: IC.person });
    return Promise.resolve(null);
  }
  const body = new URLSearchParams({
    grant_type: 'authorization_code',
    code, redirect_uri: SSO.redirect,
    client_id: SSO.clientId, code_verifier: verifier
  });
  return fetch(SSO.issuer + '/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body
  })
    .then(r => r.json())
    .then(tok => {
      if(!tok.access_token) throw new Error(tok.error_description || tok.error || 'no token');
      store.set('kos.sso.tok', tok.access_token);
      return fetch(SSO.issuer + '/userinfo', { headers: { Authorization: 'Bearer ' + tok.access_token } })
        .then(r => r.json());
    })
    .then(profile => {
      ME = profile;
      store.set('kos.me', ME);
      /* your KONEKT appearance follows you onto the desktop */
      if(profile.look && typeof KONEKT_LOOK !== 'undefined'){
        try{ KONEKT_LOOK.set(profile.look); }catch(e){}
      }
      if(profile.name){ user.name = profile.name; store.set('kos.user', user); }
      renderStartMenu();
      notify({ title: TT('ssoHello') + ' ' + (profile.name || profile.preferred_username || ''),
               body: TT('ssoBody'), icon: IC.person });
      return ME;
    })
    .catch(err => {
      notify({ title: TT('ssoFailed'), body: String(err.message || err), icon: IC.person });
      return null;
    });
}
function ssoLogout(){
  const tok = store.get('kos.sso.tok', null);
  ME = null;
  store.del('kos.me'); store.del('kos.sso.tok');
  renderStartMenu();
  if(ssoAvailable()){
    const u = new URL(SSO.issuer + '/logout');
    u.searchParams.set('client_id', SSO.clientId);
    u.searchParams.set('post_logout_redirect_uri', SSO.redirect);
    location.href = u.toString();
  } else toast(TT('ssoBye'), 2600);
}

/* ---------------------------- software update ----------------------------
   Checked once at every start — and from Settings or `update` in the shell.
   version.json is fetched fresh, compared, and the answer is yours: the OS
   never updates itself behind your back. Same flow on a phone and on a desk. */
/* When KONEKT OS is the operating system, its service answers on /api and the
   update below stops being a simulation. In a browser tab SYS stays null. */
let SYS = null;
function sysProbe(){
  return fetch('/api/status', { cache:'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(d => { SYS = (d && d.ok) ? d : null; return SYS; })
    .catch(() => { SYS = null; return null; });
}
function sysPost(path, body){
  return fetch(path, {
    method:'POST', cache:'no-store',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(body || {})
  }).then(r => r.json().then(d => { if(!r.ok || !d.ok) throw new Error(d.error || ('HTTP ' + r.status)); return d; }));
}

const OS_VERSION = '1.9.1';
const OS_BUILD = 2910;
let updateChecked = false, toastT = null;

function cmpVer(a, b){
  const A = String(a || '0').split('.').map(n => parseInt(n, 10) || 0);
  const B = String(b || '0').split('.').map(n => parseInt(n, 10) || 0);
  for(let i = 0; i < Math.max(A.length, B.length); i++){
    const x = A[i] || 0, y = B[i] || 0;
    if(x !== y) return x > y ? 1 : -1;
  }
  return 0;
}
function toast(msg, ms){
  const t = $('#ktoast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), ms || 3400);
}
function closeModal(){
  const m = $('#kmodal');
  m.classList.remove('on');
  m.innerHTML = '';
}
function checkUpdate(opts){
  opts = opts || {};
  if(opts.loud) toast('Проверяем обновления…', 2000);
  /* On the OS the service asks the origin for us — a page cannot, the origin
     is another site. In a tab we compare against the manifest we were served. */
  const ask = SYS
    ? fetch('/api/update/check', { cache:'no-store' })
        .then(r => r.json())
        .then(d => { if(!d.ok) throw new Error(d.error || 'update check failed'); return d.remote; })
    : fetch('version.json?t=' + Date.now(), { cache:'no-store' })
        .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  return ask
    .then(info => {
      if(!info || !info.version) throw new Error('bad manifest');
      const vc = cmpVer(info.version, OS_VERSION);
      const newer = vc > 0 || (vc === 0 && +(info.build || 0) > OS_BUILD);
      if(newer){
        /* if we already tried this exact version and came back on the old one,
           say so instead of asking again forever */
        if(store.get('kos.updateTried', null) === info.version + '+' + (info.build || 0)){
          toast('Обновление ' + info.version + ' не применилось');
          return { info, newer, stuck:true };
        }
        notify({ app:'system', title: TT('updAvail'), body: 'KONEKT OS ' + info.version, icon: IC.globe,
                 action: () => showUpdate(info) });
        showUpdate(info);
      } else if(opts.loud){
        toast('Установлена последняя версия — ' + OS_VERSION);
      }
      return { info, newer };
    })
    .catch(err => {
      if(opts.loud) toast('Сервер обновлений недоступен');
      return { error: err };
    });
}
function showUpdate(info){
  const m = $('#kmodal');
  const notes = (info.notes || []).slice(0, 6);
  m.innerHTML =
    '<div class="km-card">' +
      '<div class="km-head"><span class="g">' + globe(30, 6) + '</span>' +
        '<div><div class="km-t">Доступно обновление</div>' +
          '<div class="km-v">' + esc(OS_VERSION) + ' → ' + esc(info.version) +
            (info.build ? ' · build ' + esc(String(info.build)) : '') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="km-body">' +
        (info.summary ? '<p>' + esc(info.summary) + '</p>' : '') +
        (notes.length ? '<ul class="km-notes">' + notes.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul>' : '') +

/* ---------------------------- window manager ---------------------------- */
const wm = { wins: [], z: 10, space: 0 };
const isSmall = () => matchMedia('(max-width:720px)').matches;

function winFor(appId){ return wm.wins.find(w => w.app === appId) || null; }
function focusWin(w){
  /* focusing a window that lives on another workspace takes you there */
  if(spaceOf(w) !== wm.space){ wm.space = spaceOf(w); syncSpaces(); }
  wm.wins.forEach(x => x.el.classList.remove('focus'));
  w.el.classList.add('focus');
  w.el.style.zIndex = ++wm.z;
  w.mru = ++mruSeq;
  tbSync();
}
function topWin(){
  let best = null;
  for(const w of wm.wins)
    if(!w.min && spaceOf(w) === wm.space && (!best || +w.el.style.zIndex > +best.el.style.zIndex)) best = w;
  return best;
}
function closeWin(w){
  wm.wins = wm.wins.filter(x => x !== w);
  if(w.onClose) try{ w.onClose(); }catch(e){}
  w.el.remove();
  const t = topWin();
  if(t) focusWin(t); else tbSync();
}
function closeAllWindows(){ wm.wins.slice().forEach(closeWin); }
function minWin(w){
  w.min = true;
  w.el.classList.add('minz');
  const t = topWin();
  if(t) focusWin(t); else tbSync();
}
function unminWin(w){
  w.min = false;
  w.el.classList.remove('minz');
  focusWin(w);
}
function maxWin(w, on){
  w.maxed = on;
  if(on){
    w.restoreRect = { l: w.el.offsetLeft, t: w.el.offsetTop, w: w.el.offsetWidth, h: w.el.offsetHeight };
    Object.assign(w.el.style, { left:'0px', top:'0px', width:'100%', height:'100%' });
    w.el.classList.add('maxed');
  } else {
    const r = w.restoreRect || { l:40, t:40, w:640, h:440 };
    Object.assign(w.el.style, { left:r.l+'px', top:r.t+'px', width:r.w+'px', height:r.h+'px' });
    w.el.classList.remove('maxed');
  }
  w.btnMax.innerHTML = on ? IC.restore : IC.max;
  w.btnMax.title = on ? 'Restore' : 'Maximize';
}
let spawnN = 0;
function createWin(appId, title, iconSvg, opts){
  opts = opts || {};

  const w = {

    '</section>');

  const dw = desk.clientWidth, dh = desk.clientHeight;
  const ww = Math.min(opts.w || 640, dw - 20), wh = Math.min(opts.h || 440, dh - 20);
  const off = (spawnN++ % 7) * 26;
  winEl.style.width = ww + 'px';
  winEl.style.height = wh + 'px';
  winEl.style.left = Math.max(6, Math.min(dw - ww - 6, Math.round((dw - ww) / 2) + off - 60)) + 'px';
  winEl.style.top  = Math.max(6, Math.min(dh - wh - 6, Math.round((dh - wh) / 2.4) + off - 40)) + 'px';

  winEl.addEventListener('pointerdown', () => { if(topWin() !== w) focusWin(w); });
  $('.wb.min', winEl).onclick = e => { e.stopPropagation(); minWin(w); };

  $('.wb.cls', winEl).onclick = e => { e.stopPropagation(); closeWin(w); };

  installDrag(w);
  installResize(w);

  focusWin(w);
  return w;
}

/* drag + edge snap */
const ghost = () => $('#snapghost');
function snapRect(kind, dw, dh){
  if(kind === 'left')  return { l:0, t:0, w:Math.round(dw/2), h:dh };
  if(kind === 'right') return { l:Math.round(dw/2), t:0, w:dw - Math.round(dw/2), h:dh };
  if(kind === 'top')   return { l:0, t:0, w:dw, h:dh };
  return null;
}
function installDrag(w){
  const tb = $('.win-tb', w.el);
  let sx, sy, sl, st, moved, snap;
  tb.addEventListener('pointerdown', e => {
    if(e.target.closest('.wb') || e.button === 2 || isSmall()) return;
    focusWin(w);
    sx = e.clientX; sy = e.clientY;
    sl = w.el.offsetLeft; st = w.el.offsetTop;
    moved = false; snap = null;
    tb.setPointerCapture(e.pointerId);
    document.body.classList.add('dragging');
    w.el.classList.add('dragged');

    const move = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if(!moved && Math.abs(dx) + Math.abs(dy) < 3) return;
      if(w.maxed){
        /* dragging a maximized window peels it off under the pointer */
        const r = w.restoreRect || { w:640, h:440 };
        maxWin(w, false);
        sl = Math.round(ev.clientX - r.w / 2); st = Math.max(0, ev.clientY - 14);
        w.el.style.left = sl + 'px'; w.el.style.top = st + 'px';
        sx = ev.clientX; sy = ev.clientY;
        moved = true;
        return;
      }
      moved = true;
      const desk = $('#desk'), dw = desk.clientWidth, dh = desk.clientHeight;
      let nl = sl + dx, nt = st + dy;
      nt = Math.max(0, Math.min(dh - 30, nt));
      nl = Math.max(60 - w.el.offsetWidth, Math.min(dw - 60, nl));
      w.el.style.left = nl + 'px';
      w.el.style.top = nt + 'px';
      const g = ghost();
      snap = ev.clientX <= 6 ? 'left' : ev.clientX >= dw - 6 ? 'right' : ev.clientY <= 4 ? 'top' : null;
      if(snap){
        const r = snapRect(snap, dw, dh);
        Object.assign(g.style, { display:'block', left:r.l+'px', top:r.t+'px', width:r.w+'px', height:r.h+'px' });
      } else g.style.display = 'none';
    };
    const up = ev => {
      tb.releasePointerCapture(e.pointerId);
      tb.removeEventListener('pointermove', move);
      tb.removeEventListener('pointerup', up);
      tb.removeEventListener('pointercancel', up);
      document.body.classList.remove('dragging');
      w.el.classList.remove('dragged');
      ghost().style.display = 'none';
      if(!snap) return;
      const desk = $('#desk');
      if(snap === 'top'){ maxWin(w, true); return; }
      const r = snapRect(snap, desk.clientWidth, desk.clientHeight);
      w.restoreRect = { l: w.el.offsetLeft, t: w.el.offsetTop, w: w.el.offsetWidth, h: w.el.offsetHeight };
      Object.assign(w.el.style, { left:r.l+'px', top:r.t+'px', width:r.w+'px', height:r.h+'px' });
    };
    tb.addEventListener('pointermove', move);
    tb.addEventListener('pointerup', up);
    tb.addEventListener('pointercancel', up);
  });
  tb.addEventListener('dblclick', e => {
    if(e.target.closest('.wb') || isSmall()) return;
    maxWin(w, !w.maxed);
  });
}
function installResize(w){
  $$('.rs', w.el).forEach(h => {
    h.addEventListener('pointerdown', e => {
      if(w.maxed) return;
      e.preventDefault();
      focusWin(w);
      const dir = h.className.replace('rs ', '');
      const sx = e.clientX, sy = e.clientY;
      const sl = w.el.offsetLeft, st = w.el.offsetTop;
      const sw = w.el.offsetWidth, sh = w.el.offsetHeight;
      const minW = 260, minH = 160;
      h.setPointerCapture(e.pointerId);
      document.body.classList.add('dragging');
      w.el.classList.add('dragged');
      const move = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        let nl = sl, nt = st, nw = sw, nh = sh;
        if(dir.includes('e')) nw = Math.max(minW, sw + dx);
        if(dir.includes('s')) nh = Math.max(minH, sh + dy);
        if(dir.includes('w')){ nw = Math.max(minW, sw - dx); nl = sl + (sw - nw); }
        if(dir.includes('n')){ nh = Math.max(minH, sh - dy); nt = Math.max(0, st + (sh - nh)); nh = sh + (st - nt); }
        Object.assign(w.el.style, { left:nl+'px', top:nt+'px', width:nw+'px', height:nh+'px' });
      };
      const up = () => {
        h.releasePointerCapture(e.pointerId);
        h.removeEventListener('pointermove', move);
        h.removeEventListener('pointerup', up);
        document.body.classList.remove('dragging');
        w.el.classList.remove('dragged');
      };
      h.addEventListener('pointermove', move);
      h.addEventListener('pointerup', up);
    });
  });
}

/* ---------------------------- desktop icons ---------------------------- */
function renderIcons(){
  const box = $('#icons');
  box.innerHTML = '';
  const add = (iconSvg, label, open, ctx) => {
    const d = el('<button class="dico" aria-label="' + esc(label) + '">' + iconSvg + '<span class="t">' + esc(label) + '</span></button>');
    d.onclick = e => { e.stopPropagation(); $$('.dico', box).forEach(x => x.classList.remove('sel')); d.classList.add('sel'); };
    d.ondblclick = e => { e.stopPropagation(); open(); };
    d.onkeydown = e => { if(e.key === 'Enter') open(); };
    if(ctx) d.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); showCMenu(e.clientX, e.clientY, ctx()); };
    box.appendChild(d);
  };
  Object.entries(APPS).forEach(([id, a]) => add(a.icon, a.name, () => openApp(id)));
  add(IC.trash, 'TRASH', () => openApp('files', { path: HOME.concat('.trash') }));
  /* real files from ~/Desktop, after the apps */
  const dt = fsGet(HOME.concat('Desktop'));
  if(dt && dt.type === 'dir'){
    Object.keys(dt.children).filter(n => n[0] !== '.').sort().forEach(name => {
      const node = dt.children[name];
      const p = HOME.concat('Desktop', name);
      const open = node.type === 'dir'
        ? () => openApp('files', { path: p })
        : () => openApp('notes', { path: p });
      add(node.type === 'dir' ? IC.files : IC.file, name, open, () => [
        { t:'Open', icon:IC.file, fn: open },
        { t:'Delete', icon:IC.trash, fn: () => { fsRm(p, true); renderIcons(); refreshFiles(); } }
      ]);
    });
  }
}
